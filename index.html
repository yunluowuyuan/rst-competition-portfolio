<!DOCTYPE html>
<!-- ============================================================
     徐浩渊 · 个人主页（单文件纯净架构）
     ────────────────────────────────────────────────────────────
     技术栈   ：HTML5 语义化 + CSS3（CSS 变量双主题）+ 原生 JS
     分层结构 ：
       1. <head>          —— 元信息 / CSS 主题变量 / 全量样式
       2. <body> 静态骨架  —— 星幕背景 / 顶栏导航 / 主容器 / 游戏弹窗
       3. <script> 数据层  —— resume 结构化数据（经历/项目/技能…）
       4. <script> 渲染层  —— buildXxxSection() 模板注入 #app
       5. <script> 交互层  —— 主题切换 / 弹窗 / Tab 键盘导航 / 打印
     无障碍   ：语义化标签 + ARIA + skip-link + 弹窗焦点圈定 + ESC 关闭
     适配     ：375px ~ 1920px 无横向溢出；深空/明亮双主题；A4 打印归档
     ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="themeColorMeta" content="#0f1923">
    <title>徐浩渊 - 个人简历 | 工业工程 × 航空航天 × AI · 深空版</title>
    <style>
        :root {
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --color-primary: #1e3b5c;
            --color-primary-light: #2a5580;
            --color-primary-dark: #152b42;
            --color-accent: #c8913e;
            --color-accent-light: #dba855;
            --color-accent-glow: rgba(200, 145, 62, 0.25);
            --color-bg: #f9f7f3;
            --color-surface: #ffffff;
            --color-surface-alt: #f2efe9;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-bg-strong: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-blur: blur(14px);
            --color-text: #1a1a1a;
            --color-text-secondary: #475569;
            --color-text-muted: #5b6b80;
            --color-border: #e0dcd5;
            --color-border-light: #ece8e1;
            --color-shadow: rgba(30, 59, 92, 0.07);
            --color-shadow-lg: rgba(30, 59, 92, 0.12);
            --color-nav-bg: rgba(249, 247, 243, 0.88);
            --color-hero-gradient-start: #1e3b5c;
            --color-hero-gradient-end: #2a4a6e;
            --color-hero-text: #2c2c2c;
            --color-hero-sub: #5c5c5c;
            --color-badge-bg: rgba(200, 145, 62, 0.1);
            --color-badge-text: #8a5e2a;
            --color-badge-border: rgba(200, 145, 62, 0.25);
            --color-tab-active: #1e3b5c;
            --color-tab-indicator: #c8913e;
            --color-progress-bg: #e8e4dc;
            --color-progress-fill: #1e3b5c;
            --color-card-hover-shadow: rgba(30, 59, 92, 0.16);
            --color-divider: #e8e4dc;
            --color-timeline-dot: #c8913e;
            --color-timeline-line: #d8d3c9;
            --color-input-focus: #1e3b5c;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition-fast: 160ms ease;
            --transition-smooth: 240ms ease;
            --transition-slow: 350ms ease;
            --nav-height: 56px;
            --max-width: 1080px;
            --section-gap: 2.8rem;
        }

        /* 全局横向溢出防护：overflow-x:clip 不破坏 position:fixed 顶栏；
           hidden 作为旧内核兜底；打印时恢复以兼容分页 */
        html {
            overflow-x: hidden;
            overflow-x: clip;
        }
        @media print {
            html {
                overflow-x: visible;
            }
        }

        [data-theme="dark"] {
            --color-bg: #0f1923;
            --color-surface: #182230;
            --color-surface-alt: #1d2a38;
            --glass-bg: rgba(20, 30, 44, 0.5);
            --glass-bg-strong: rgba(20, 30, 44, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(14px);
            --color-text: #F1F5F9;
            --color-text-secondary: #D4DBE5;
            --color-text-muted: #A8B0BD;
            --color-border: #2a3542;
            --color-border-light: #242f3a;
            --color-shadow: rgba(0, 0, 0, 0.25);
            --color-shadow-lg: rgba(0, 0, 0, 0.4);
            --color-nav-bg: rgba(12, 18, 32, 0.85);
            --color-hero-gradient-start: #111d2b;
            --color-hero-gradient-end: #1a2d40;
            --color-hero-text: #f0ece6;
            --color-hero-sub: rgba(240, 236, 230, 0.8);
            --color-badge-bg: rgba(200, 145, 62, 0.14);
            --color-badge-text: #dba855;
            --color-badge-border: rgba(200, 145, 62, 0.3);
            --color-tab-active: #c8913e;
            --color-tab-indicator: #dba855;
            --color-progress-bg: #253240;
            --color-progress-fill: #c8913e;
            --color-card-hover-shadow: rgba(0, 0, 0, 0.45);
            --color-divider: #2a3542;
            --color-timeline-line: #2e3a48;
            --color-input-focus: #dba855;
            --color-primary: #4a8bc2;
            --color-primary-light: #5fa0d4;
            --color-primary-dark: #356a94;
            --color-accent: #dba855;
            --color-accent-light: #e8c97a;
            --color-accent-glow: rgba(219, 168, 85, 0.3);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: var(--font-stack);
            background: transparent;
            color: var(--color-text);
            line-height: 1.65;
            transition: color var(--transition-smooth);
            min-height: 100vh;
            padding-top: var(--nav-height);
            letter-spacing: 0.01em;
            position: relative;
            z-index: 0;
        }

        /* ============ STARFIELD BACKGROUND ============ */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
            overflow: visible;
            background: radial-gradient(circle at 50% 30%, #151d2a 0%, #0b0f19 70%, #05070d 100%);
        }

        [data-theme="light"] .starfield {
            background: linear-gradient(135deg, #f0f4f9 0%, #e2ebf5 50%, #d6e2f0 100%);
        }

        /* 星云光晕层 - 仅深色模式可见 */
        .starfield::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(120, 80, 180, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(60, 120, 160, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 30%, rgba(100, 140, 200, 0.08) 0%, transparent 65%);
            pointer-events: none;
            transition: opacity var(--transition-smooth);
        }
        [data-theme="light"] .starfield::before {
            opacity: 0;
        }

        /* 巨型星球光晕 - 右下角蓝色星体 */
        .starfield::after {
            content: '';
            position: absolute;
            bottom: -5%;
            right: -5%;
            width: 55vh;
            height: 55vh;
            background:
                radial-gradient(circle at 75% 75%, rgba(59, 130, 246, 0.35) 0%, rgba(30, 59, 92, 0.2) 40%, rgba(15, 30, 60, 0.08) 65%, transparent 80%),
                radial-gradient(circle at 75% 75%, rgba(100, 160, 255, 0.15) 0%, transparent 35%);
            filter: blur(30px);
            pointer-events: none;
            transition: opacity var(--transition-smooth);
        }
        [data-theme="light"] .starfield::after {
            opacity: 0.45;
            background:
                radial-gradient(circle at 75% 75%, rgba(200, 145, 62, 0.25) 0%, rgba(59, 130, 246, 0.12) 40%, transparent 70%);
        }

        /* 顶部对称光晕 - 左上角淡金星云 */
        .starfield .glow-top {
            position: absolute;
            top: -8%;
            left: -5%;
            width: 45vh;
            height: 45vh;
            background:
                radial-gradient(circle at 30% 30%, rgba(200, 145, 62, 0.18) 0%, rgba(140, 90, 30, 0.1) 45%, transparent 70%);
            filter: blur(35px);
            pointer-events: none;
        }
        [data-theme="light"] .starfield .glow-top {
            opacity: 0.4;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.2) 0%, transparent 60%);
        }

        /* Canvas 星空层 */
        #spaceCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bg-image {
            display: none;
        }

        .bg-gradient-overlay {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ============ NAVIGATION ============ */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            background: var(--color-nav-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--color-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.2rem;
            transition: all var(--transition-smooth);
        }
        .nav-inner {
            width: 100%;
            max-width: var(--max-width);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.08rem;
            color: var(--color-primary);
            white-space: nowrap;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--color-text-secondary);
            font-size: 0.84rem;
            font-weight: 500;
            padding: 0.4rem 0.65rem;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            white-space: nowrap;
            letter-spacing: 0.015em;
        }
        .nav-links a:hover,
        .nav-links a:focus-visible {
            color: var(--color-primary);
            background: var(--color-badge-bg);
            outline: none;
        }
        .nav-links a:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all var(--transition-fast);
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-icon:hover {
            background: var(--color-surface-alt);
            color: var(--color-primary);
            border-color: var(--color-accent);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .btn-icon:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }
        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            pointer-events: none;
        }

        @media (max-width: 680px) {
            .nav-links a {
                font-size: 0.76rem;
                padding: 0.3rem 0.45rem;
            }
            .nav-brand {
                font-size: 0.95rem;
            }
            .btn-icon {
                width: 30px;
                height: 30px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 520px) {
            .nav-links a.nav-link-optional {
                display: none;
            }
            .nav-links a {
                font-size: 0.73rem;
                padding: 0.28rem 0.38rem;
            }
        }

        /* ============ MAIN CONTAINER ============ */
        .main-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.3rem 3rem;
            position: relative;
            z-index: 10;
        }

        /* ============ HERO SECTION ============ */
        .hero {
            background: rgba(8, 14, 28, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 145, 62, 0.22);
            color: var(--color-hero-text);
            padding: 2.5rem 2rem 2.8rem;
            border-radius: var(--radius-xl);
            margin-top: 1.8rem;
            position: relative;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(200, 145, 62, 0.08);
            transition: box-shadow var(--transition-smooth);
        }
        .hero:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(59, 130, 246, 0.15);
        }
        [data-theme="light"] .hero {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(200, 145, 62, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 0 20px rgba(200, 145, 62, 0.06);
        }
        .hero::before,
        .hero::after {
            display: none;
        }
        .hero>* {
            position: relative;
            z-index: 1;
        }
        .hero-name {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            color: #FFFFFF;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }
        [data-theme="light"] .hero-name {
            color: #1a1a1a;
            text-shadow: none;
        }
        .hero-tagline {
            font-size: 1.1rem;
            font-weight: 500;
            color: #E2E8F0;
            max-width: 620px;
            margin: 0 auto 1.3rem;
            line-height: 1.7;
            letter-spacing: 0.02em;
        }
        [data-theme="light"] .hero-tagline {
            color: #334155;
        }
        .hero-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .hero-badge {
            display: inline-block;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: rgba(200, 145, 62, 0.12);
            color: #F5D998;
            border: 1px solid rgba(200, 145, 62, 0.3);
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        [data-theme="light"] .hero-badge {
            color: #8B6914;
        }
        .hero-badge:hover {
            background: rgba(200, 145, 62, 0.22);
            border-color: rgba(200, 145, 62, 0.5);
            transform: translateY(-1px);
        }
        .hero-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            justify-content: center;
            align-items: center;
        }
        .hero-contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.1rem;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.02em;
            cursor: pointer;
            border: 1.5px solid rgba(200, 145, 62, 0.4);
            background: rgba(200, 145, 62, 0.08);
            color: #F5D998;
            transition: all var(--transition-fast);
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-stack);
        }
        [data-theme="light"] .hero-contact-btn {
            color: #8B6914;
        }
        .hero-contact-btn:hover {
            background: rgba(200, 145, 62, 0.18);
            border-color: rgba(200, 145, 62, 0.65);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
        }
        .hero-contact-btn.btn-accent {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: #1a1a1a;
            font-weight: 700;
        }
        .hero-contact-btn.btn-accent:hover {
            background: var(--color-accent-light);
            border-color: var(--color-accent-light);
            box-shadow: 0 6px 22px var(--color-accent-glow);
        }
        .hero-contact-btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        @media (max-width: 600px) {
            .hero {
                padding: 2.2rem 1.2rem 2.4rem;
                border-radius: var(--radius-lg);
                margin-top: 1rem;
            }
            .hero-name {
                font-size: 1.7rem;
            }
            .hero-tagline {
                font-size: 0.92rem;
            }
            .hero-badge {
                font-size: 0.74rem;
                padding: 0.3rem 0.7rem;
            }
            .hero-contact-btn {
                font-size: 0.78rem;
                padding: 0.45rem 0.85rem;
            }
        }

        /* ============ SECTION COMMON ============ */
        .section {
            margin-top: var(--section-gap);
            scroll-margin-top: calc(var(--nav-height) + 16px);
        }
        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.03em;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
        }
        [data-theme="light"] .section-title {
            color: var(--color-primary);
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-divider);
            min-width: 20px;
            margin-left: 0.3rem;
        }
        .section-prefix {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-accent);
            letter-spacing: 0.12em;
            opacity: 0.7;
            font-variant-numeric: tabular-nums;
        }
        .section-title .section-title-text {
            font-size: 1.35rem;
            font-weight: 700;
        }
        .section-subtitle {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            margin-top: -0.7rem;
            margin-bottom: 1.2rem;
            letter-spacing: 0.02em;
        }

        /* ============ HIGHLIGHTS ============ */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }
        .highlight-card {
            background: rgba(8, 14, 28, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 145, 62, 0.22);
            border-radius: var(--radius-md);
            padding: 1.3rem 1.2rem;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-left: 3px solid rgba(200, 145, 62, 0.55);
        }
        .highlight-card:hover {
            transform: translateY(-3px);
            background: rgba(8, 14, 28, 0.45);
            border-color: rgba(200, 145, 62, 0.4);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4), 0 0 25px rgba(59, 130, 246, 0.15);
        }
        [data-theme="light"] .highlight-card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(200, 145, 62, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .highlight-card:hover {
            background: rgba(255, 252, 245, 0.7);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
        }
        .highlight-card .hl-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-accent);
            letter-spacing: 0.02em;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .highlight-card .hl-label {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            line-height: 1.5;
            letter-spacing: 0.015em;
        }
        .highlight-card .hl-icon {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 1.6rem;
            opacity: 0.15;
            pointer-events: none;
        }
        .highlight-card.featured {
            border-left: 3px solid rgba(200, 145, 62, 0.8);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 24px rgba(200, 145, 62, 0.08);
        }
        .highlight-card.featured .hl-number {
            color: var(--color-accent);
        }

        /* ============ TABS ============ */
        .tabs-container {
            background: rgba(8, 14, 28, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(200, 145, 62, 0.22);
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        }
        [data-theme="light"] .tabs-container {
            background: rgba(255, 252, 245, 0.55);
            border: 1px solid rgba(200, 145, 62, 0.25);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
        }
        .tabs-nav {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) transparent;
            background: transparent;
        }
        .tabs-nav::-webkit-scrollbar {
            height: 3px;
        }
        .tabs-nav::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }
        .tab-btn {
            flex-shrink: 0;
            padding: 0.85rem 1.3rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            letter-spacing: 0.02em;
            transition: all var(--transition-fast);
            position: relative;
            white-space: nowrap;
            font-family: var(--font-stack);
            -webkit-tap-highlight-color: transparent;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
        }
        .tab-btn:hover {
            color: var(--color-primary);
            background: rgba(30, 59, 92, 0.03);
        }
        .tab-btn:first-child {
            color: #F5D998;
            font-weight: 700;
        }
        [data-theme="light"] .tab-btn:first-child {
            color: #8B6914;
        }
        .tab-btn[aria-selected="true"] {
            color: var(--color-tab-active);
            border-bottom-color: var(--color-tab-indicator);
            background: transparent;
        }
        .tab-btn.tab-featured[aria-selected="true"] {
            color: #F5D998;
        }
        [data-theme="light"] .tab-btn.tab-featured[aria-selected="true"] {
            color: #8B6914;
        }
        .tab-btn:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: -2px;
            z-index: 2;
        }
        .tab-panel {
            padding: 1.5rem 1.4rem;
            animation: fadeSlideIn 280ms ease;
        }
        .tab-panel[hidden] {
            display: none;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 500px) {
            .tab-btn {
                padding: 0.7rem 0.9rem;
                font-size: 0.8rem;
            }
            .tab-panel {
                padding: 1.1rem 0.9rem;
            }
        }

        /* ============ CARDS ============ */
        .card {
            background: rgba(8, 14, 28, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 145, 62, 0.22);
            border-radius: var(--radius-md);
            padding: 1.3rem 1.3rem;
            transition: all var(--transition-smooth);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }
        .card:hover {
            transform: translateY(-2px);
            background: rgba(8, 14, 28, 0.45);
            border-color: rgba(200, 145, 62, 0.4);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4), 0 0 25px rgba(59, 130, 246, 0.15);
        }
        [data-theme="light"] .card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(200, 145, 62, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .card:hover {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
        }
        .card.featured {
            border-left: 3px solid rgba(200, 145, 62, 0.7);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4), 0 0 24px rgba(200, 145, 62, 0.06);
        }
        [data-theme="light"] .card.featured {
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14), 0 0 20px rgba(200, 145, 62, 0.05);
        }
        .tab-btn.tab-featured {
            color: #F5D998 !important;
            font-weight: 700;
        }
        [data-theme="light"] .tab-btn.tab-featured {
            color: #8B6914 !important;
        }
        .card:last-child {
            margin-bottom: 0;
        }
        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.7rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #FFFFFF;
            letter-spacing: 0.02em;
        }
        [data-theme="light"] .card-title {
            color: var(--color-primary);
        }
        .card-subtitle {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            letter-spacing: 0.015em;
            white-space: nowrap;
        }
        .card-meta {
            font-size: 0.8rem;
            color: var(--color-accent);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .card-body {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            line-height: 1.7;
            letter-spacing: 0.015em;
            font-weight: 500;
        }
        .card-body ul {
            list-style: none;
            padding: 0;
        }
        .card-body ul li {
            padding-left: 1.1em;
            position: relative;
            margin-bottom: 0.35rem;
        }
        .card-body ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
            font-size: 0.75em;
            top: 0.15em;
        }
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.8rem;
        }
        .card-tag {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            background: var(--color-badge-bg);
            color: var(--color-badge-text);
            border: 1px solid var(--color-badge-border);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .card-game-entry {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed rgba(200, 145, 62, 0.3);
        }
        .game-launch-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(200, 145, 62, 0.18));
            border: 1px solid rgba(200, 145, 62, 0.4);
            border-radius: var(--radius-md);
            color: #F5D998;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        [data-theme="light"] .game-launch-btn {
            color: #8B6914;
        }
        .game-launch-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(200, 145, 62, 0.25));
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .game-launch-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(200, 145, 62, 0.6);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.25), 0 0 15px rgba(200, 145, 62, 0.15);
        }
        .game-launch-btn:hover::before {
            opacity: 1;
        }
        .game-btn-icon,
        .game-btn-text {
            position: relative;
            z-index: 1;
        }
        .game-btn-icon {
            font-size: 1.1rem;
            animation: rocketBob 1.8s ease-in-out infinite;
        }
        @keyframes rocketBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* ============ GAME MODAL ============ */
        .game-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 2rem;
            align-items: center;
            justify-content: center;
        }
        .game-modal.active {
            display: flex;
        }
        .game-modal-content {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 90vh;
            background: #000;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(200, 145, 62, 0.4);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.2), 0 0 80px rgba(200, 145, 62, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .game-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: rgba(8, 14, 28, 0.9);
            border-bottom: 1px solid rgba(200, 145, 62, 0.3);
        }
        .game-modal-title {
            color: #F5D998;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }
        .game-modal-close {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(200, 145, 62, 0.3);
            color: #F5D998;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        .game-modal-close:hover {
            background: rgba(200, 145, 62, 0.3);
            transform: rotate(90deg);
        }
        .game-modal-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #000;
        }

        /* ============ SKILL MATRIX ============ */
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .skill-item {
            background: rgba(8, 14, 28, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 145, 62, 0.22);
            border-radius: var(--radius-md);
            padding: 1rem 1.2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all var(--transition-smooth);
        }
        .skill-item:hover {
            transform: translateY(-1px);
            background: rgba(8, 14, 28, 0.5);
            border-color: rgba(200, 145, 62, 0.4);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4), 0 0 25px rgba(59, 130, 246, 0.15);
        }
        [data-theme="light"] .skill-item {
            background: rgba(255, 252, 245, 0.55);
            border: 1px solid rgba(200, 145, 62, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .skill-item:hover {
            background: rgba(255, 252, 245, 0.7);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
        }
        .skill-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            gap: 0.5rem;
        }
        .skill-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #FFFFFF;
            letter-spacing: 0.02em;
        }
        [data-theme="light"] .skill-name {
            color: var(--color-text);
        }
        .skill-stage-badge {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0.25rem 0.65rem;
            border-radius: 12px;
            white-space: nowrap;
            transition: all var(--transition-fast);
        }
        .skill-stage-badge.stage-basic {
            background: rgba(100, 116, 139, 0.18);
            color: #94A3B8;
            border: 1px solid rgba(100, 116, 139, 0.3);
        }
        .skill-stage-badge.stage-practice {
            background: rgba(59, 130, 246, 0.15);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .skill-stage-badge.stage-core {
            background: rgba(200, 145, 62, 0.18);
            color: #F5D998;
            border: 1px solid rgba(200, 145, 62, 0.4);
        }
        [data-theme="light"] .skill-stage-badge.stage-basic {
            background: rgba(100, 116, 139, 0.1);
            color: #475569;
            border-color: rgba(100, 116, 139, 0.25);
        }
        [data-theme="light"] .skill-stage-badge.stage-practice {
            background: rgba(59, 130, 246, 0.1);
            color: #1d4ed8;
            border-color: rgba(59, 130, 246, 0.25);
        }
        [data-theme="light"] .skill-stage-badge.stage-core {
            background: rgba(200, 145, 62, 0.12);
            color: #8B6914;
            border-color: rgba(200, 145, 62, 0.3);
        }
        .skill-detail {
            font-size: 0.76rem;
            color: var(--color-text-muted);
            margin-top: 0.4rem;
            letter-spacing: 0.015em;
            line-height: 1.4;
        }
        .skill-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.4rem;
            margin-bottom: 1rem;
            padding: 0.7rem 1rem;
            border: 1px dashed var(--color-border-light);
            border-radius: var(--radius-sm);
            background: rgba(8, 14, 28, 0.18);
            font-size: 0.78rem;
            color: var(--color-text-muted);
        }
        [data-theme="light"] .skill-legend {
            background: rgba(255, 252, 245, 0.35);
        }
        .skill-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            white-space: nowrap;
        }
        .skill-legend-desc {
            letter-spacing: 0.015em;
        }
        @media (max-width: 640px) {
            .skill-legend-desc {
                display: none;
            }
        }
        @media (max-width: 400px) {
            .skill-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ============ TIMELINE ============ */
        .timeline {
            position: relative;
            padding-left: 1.8rem;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--color-timeline-line);
            border-radius: 1px;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
            padding-left: 0.6rem;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        .timeline-dot {
            position: absolute;
            left: -1.55rem;
            top: 0.3rem;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--color-timeline-dot);
            box-shadow: 0 0 0 4px transparent;
            z-index: 1;
        }
        .timeline-content .tl-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #FFFFFF;
            letter-spacing: 0.02em;
        }
        [data-theme="light"] .timeline-content .tl-title {
            color: var(--color-primary);
        }
        .timeline-content .tl-sub {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            letter-spacing: 0.015em;
        }
        .timeline-content .tl-desc {
            font-size: 0.84rem;
            color: var(--color-text-secondary);
            margin-top: 0.3rem;
            line-height: 1.7;
            font-weight: 500;
        }

        /* ============ CERTIFICATES ============ */
        .cert-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 0.7rem;
        }
        .cert-item {
            background: rgba(10, 15, 28, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            font-size: 0.84rem;
            letter-spacing: 0.015em;
            border: 1px solid rgba(200, 145, 62, 0.15);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text);
        }
        .cert-item:hover {
            border-color: rgba(200, 145, 62, 0.3);
            background: rgba(10, 15, 28, 0.6);
        }
        [data-theme="light"] .cert-item {
            background: rgba(255, 252, 245, 0.5);
            border: 1px solid rgba(200, 145, 62, 0.2);
        }
        [data-theme="light"] .cert-item:hover {
            background: rgba(255, 252, 245, 0.65);
        }
        .cert-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ============ SELF-EVAL ============ */
        .eval-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .eval-card {
            background: rgba(10, 15, 28, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(200, 145, 62, 0.18);
            border-radius: var(--radius-md);
            padding: 1.2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all var(--transition-smooth);
            border-left: 3px solid var(--color-accent);
        }
        .eval-card:hover {
            transform: translateY(-2px);
            background: rgba(10, 15, 28, 0.65);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
        }
        [data-theme="light"] .eval-card {
            background: rgba(255, 252, 245, 0.55);
            border: 1px solid rgba(200, 145, 62, 0.25);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        [data-theme="light"] .eval-card:hover {
            background: rgba(255, 252, 245, 0.7);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
        }
        .eval-card .eval-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--color-primary);
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }
        .eval-card .eval-desc {
            font-size: 0.82rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            letter-spacing: 0.015em;
        }

        /* ============ FOOTER ============ */
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding: 1.5rem 0;
            border-top: 1px solid var(--color-divider);
            color: var(--color-text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            line-height: 1.8;
        }
        .footer strong {
            color: var(--color-text-secondary);
        }

        /* ============ BACK TO TOP ============ */
        .back-to-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 900;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 3px 12px var(--color-shadow-lg);
            transition: all var(--transition-smooth);
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-to-top:hover {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
            box-shadow: 0 6px 18px var(--color-card-hover-shadow);
        }
        .back-to-top svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        /* ============ COPY TOAST ============ */
        .toast {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--color-primary-dark);
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 24px;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-fast);
            font-family: var(--font-stack);
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============ CERTIFICATE MODAL ============ */
        .cert-card {
            cursor: pointer;
            transition: all var(--transition-smooth);
        }
        .cert-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 0 30px rgba(200, 145, 62, 0.15);
            border-color: rgba(200, 145, 62, 0.5);
        }
        .cert-view-hint {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: #F5D998;
            letter-spacing: 0.03em;
            transition: all var(--transition-fast);
        }
        [data-theme="light"] .cert-view-hint {
            color: #8B6914;
        }
        .cert-card:hover .cert-view-hint {
            text-shadow: 0 0 12px rgba(200, 145, 62, 0.5);
        }
        .cert-modal {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .cert-modal[hidden] {
            display: none;
        }
        .cert-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .cert-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .cert-modal-content {
            position: relative;
            width: min(92vw, 900px);
            max-height: 90vh;
            background: rgba(10, 15, 28, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(200, 145, 62, 0.25);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(200, 145, 62, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.92);
            transition: transform 0.3s ease;
        }
        .cert-modal.active .cert-modal-content {
            transform: scale(1);
        }
        .cert-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(200, 145, 62, 0.15);
        }
        .cert-modal-header h3 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: #F5D998;
            letter-spacing: 0.02em;

                    return stored;
                } catch (e) {
                    return null;
                }
            }

            function applyTheme(theme) {
                htmlEl.setAttribute('data-theme', theme);
                // 同步移动端地址栏 / 任务栏配色，避免主题切换后仍显示旧底色
                const themeColorMeta = document.getElementById('themeColorMeta');
                if (themeColorMeta) {
                    themeColorMeta.setAttribute('content', theme === 'dark' ? '#0f1923' : '#f9f7f3');
                }
                if (theme === 'dark') {
                    themeIconSun.style.display = 'none';
                    themeIconMoon.style.display = '';
                } else {

            // ==================== ACCESSIBILITY · FOCUS TRAP ====================
            // 通用焦点圈定：弹窗打开期间 Tab / Shift+Tab 在弹窗内循环，焦点不逃逸到背景
            function trapFocus(container) {
                container.addEventListener('keydown', e => {
                    if (e.key !== 'Tab') return;
                    const items = Array.from(container.querySelectorAll(
                        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
                    )).filter(el => !el.disabled && el.offsetParent !== null);
                    if (items.length === 0) return;
                    const first = items[0];
                    const last = items[items.length - 1];
                    const inside = container.contains(document.activeElement);
                    if (e.shiftKey && (!inside || document.activeElement === first)) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && (!inside || document.activeElement === last)) {
                        e.preventDefault();
                        first.focus();
                    }
                });
            }
            // 记录弹窗打开前的焦点元素，关闭后归还，保持键盘焦点连续性
            let modalLastFocused = null;
            function rememberFocus() {
                modalLastFocused = document.activeElement;
            }
            function restoreFocus() {
                if (modalLastFocused && typeof modalLastFocused.focus === 'function') {
                    modalLastFocused.focus();
                }
            }

            // ==================== EMAIL COPY ====================
            function attachEmailCopyListener() {
                const btn = document.getElementById('copyEmailBtn');
                if (!btn) return;
                btn.addEventListener('click', () => {
                    const email = fullEmail;
                    if (navigator.clipboard && navigator.clipboard.writeText) {

                        }).catch(() => {
                            fallbackCopy(email);
                        });
                    } else {

                    }
                });

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('邮箱已复制：' + text);
                } catch (e) {
                    showToast('复制失败，请手动复制');

            // ==================== TAB LOGIC ====================
            function attachTabListeners() {
                const tabRoots = document.querySelectorAll('[data-tabs-root]');
                tabRoots.forEach(root => {
                    const tabs = root.querySelectorAll('.tab-btn');
                    const panels = root.querySelectorAll('.tab-panel');
                    const tabList = tabs;

                    tabs.forEach(tab => {
                        tab.addEventListener('click', () => {
                            activateTab(root, tab.getAttribute('data-tab-id'));
                        });
                        tab.addEventListener('keydown', (e) => {
                            const currentIndex = Array.from(tabs).indexOf(tab);
                            let newIndex = currentIndex;
                            if (e.key === 'ArrowRight') {
                                e.preventDefault();
                                newIndex = (currentIndex + 1) % tabs.length;
                            } else if (e.key === 'ArrowLeft') {
                                e.preventDefault();
                                newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                            } else if (e.key === 'Home') {
                                e.preventDefault();
                                newIndex = 0;
                            } else if (e.key === 'End') {
                                e.preventDefault();
                                newIndex = tabs.length - 1;
                            }
                            if (newIndex !== currentIndex) {
                                const targetTab = tabs[newIndex];
                                activateTab(root, targetTab.getAttribute('data-tab-id'));
                                targetTab.focus();
                            }
                        });
                    });
                });
            }

            function activateTab(root, tabId) {
                const tabs = root.querySelectorAll('.tab-btn');
                const panels = root.querySelectorAll('.tab-panel');
                tabs.forEach(t => {
                    const isActive = t.getAttribute('data-tab-id') === tabId;
                    t.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    t.setAttribute('tabindex', isActive ? '0' : '-1');
                });
                panels.forEach(p => {
                    if (p.id === 'panel-' + tabId) {
                        p.removeAttribute('hidden');
                    } else {
                        p.setAttribute('hidden', '');
                    }
                });
            }

            // ==================== CANVAS STARFIELD GENERATION ====================
            function initStarfield() {
                const canvas = document.getElementById('spaceCanvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                let width = 0, height = 0;
                let stars = [];
                let brightStars = [];
                let shootingStars = [];
                let animationId = null;
                let time = 0;
                const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                function resize() {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                    canvas.style.width = width + 'px';
                    canvas.style.height = height + 'px';
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    generateStars();
                }

                function generateStars() {
                    stars = [];
                    brightStars = [];
                    const isMobile = width < 680;
                    const starCount = isMobile ? 80 : 120;

                    for (let i = 0; i < starCount; i++) {
                        const isBright = Math.random() < 0.12;
                        const star = {
                            x: Math.random() * width,
                            y: Math.random() * height,
                            radius: isBright ? Math.random() * 0.6 + 1.4 : Math.random() * 1.2 + 0.6,
                            vx: (Math.random() - 0.3) * 0.15,
                            vy: (Math.random() - 0.3) * 0.15,
                            isBright: isBright,
                            baseAlpha: isBright ? 0.6 : 0.25,
                            phase: Math.random() * Math.PI * 2,
                            pulseSpeed: 0.005 + Math.random() * 0.008
                        };
                        stars.push(star);
                        if (isBright && brightStars.length < 8) {
                            brightStars.push(star);
                        }
                    }
                }

                function getThemeColors() {
                    const theme = htmlEl.getAttribute('data-theme');
                    if (theme === 'light') {
                        return {
                            starFill: 'rgba(30, 59, 92, ',
                            brightFill: 'rgba(200, 145, 62, ',
                            lineStroke: 'rgba(30, 59, 92, 0.2)',
                            brightLineStroke: 'rgba(200, 145, 62, 0.25)',
                            glowColor: 'rgba(200, 145, 62, ',
                            shootingColor: 'rgba(30, 59, 92, '
                        };
                    }
                    return {
                        starFill: 'rgba(192, 216, 240, ',
                        brightFill: 'rgba(226, 241, 255, ',
                        lineStroke: 'rgba(180, 210, 255, 0.12)',
                        brightLineStroke: 'rgba(180, 210, 255, 0.18)',
                        glowColor: 'rgba(130, 170, 230, ',
                        shootingColor: 'rgba(226, 241, 255, '
                    };
                }

                function drawStar(star, colors) {
                    const theme = htmlEl.getAttribute('data-theme');
                    star.x += star.vx;
                    star.y += star.vy;

                    if (star.x < 0) star.x = width;
                    if (star.x > width) star.x = 0;
                    if (star.y < 0) star.y = height;
                    if (star.y > height) star.y = 0;

                    let alpha;
                    if (star.isBright) {
                        alpha = star.baseAlpha + Math.sin(time * star.pulseSpeed + star.phase) * 0.35;
                        alpha = Math.max(0.2, Math.min(1, alpha));
                    } else {
                        alpha = star.baseAlpha + Math.sin(time * star.pulseSpeed + star.phase) * 0.12;
                    }

                    if (star.isBright && theme !== 'light') {
                        const glowR = star.radius * 6;
                        const gradient = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, glowR);
                        gradient.addColorStop(0, colors.glowColor + (alpha * 0.4) + ')');
                        gradient.addColorStop(0.5, colors.glowColor + (alpha * 0.15) + ')');
                        gradient.addColorStop(1, colors.glowColor + '0)');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, glowR, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = (star.isBright ? colors.brightFill : colors.starFill) + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                function drawConnections(colors) {
                    const brightArr = brightStars;
                    for (let i = 0; i < brightArr.length; i++) {
                        for (let j = i + 1; j < brightArr.length; j++) {
                            const dx = brightArr[i].x - brightArr[j].x;
                            const dy = brightArr[i].y - brightArr[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 200) {
                                const opacity = (1 - dist / 200) * 0.25;
                                ctx.strokeStyle = colors.brightLineStroke.replace(/[\d.]+\)$/, opacity + ')');
                                ctx.lineWidth = 0.5;
                                ctx.beginPath();
                                ctx.moveTo(brightArr[i].x, brightArr[i].y);
                                ctx.lineTo(brightArr[j].x, brightArr[j].y);
                                ctx.stroke();
                            }
                        }
                    }

                    for (let i = 0; i < brightArr.length; i++) {
                        for (let s = 0; s < stars.length; s++) {
                            if (stars[s].isBright) continue;
                            const dx = brightArr[i].x - stars[s].x;
                            const dy = brightArr[i].y - stars[s].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 100) {
                                const opacity = (1 - dist / 100) * 0.15;
                                ctx.strokeStyle = colors.lineStroke.replace(/[\d.]+\)$/, opacity + ')');
                                ctx.lineWidth = 0.3;
                                ctx.beginPath();
                                ctx.moveTo(brightArr[i].x, brightArr[i].y);
                                ctx.lineTo(stars[s].x, stars[s].y);
                                ctx.stroke();
                            }
                        }
                    }
                }

                function spawnShootingStar() {
                    const theme = htmlEl.getAttribute('data-theme');
                    if (theme === 'light') return;
                    const startX = Math.random() * width * 0.6 + width * 0.2;
                    const startY = Math.random() * height * 0.3;
                    shootingStars.push({
                        x: startX,
                        y: startY,
                        length: 60 + Math.random() * 60,
                        speed: 6 + Math.random() * 4,
                        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.4,
                        alpha: 1,
                        decay: 0.008 + Math.random() * 0.006
                    });
                }

                function drawShootingStars(colors) {
                    for (let i = shootingStars.length - 1; i >= 0; i--) {
                        const s = shootingStars[i];
                        s.x += Math.cos(s.angle) * s.speed;
                        s.y += Math.sin(s.angle) * s.speed;
                        s.alpha -= s.decay;

                        if (s.alpha <= 0 || s.x > width + 100 || s.y > height + 100) {
                            shootingStars.splice(i, 1);
                            continue;
                        }

                        const tailX = s.x - Math.cos(s.angle) * s.length;
                        const tailY = s.y - Math.sin(s.angle) * s.length;
                        const gradient = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                        gradient.addColorStop(0, colors.shootingColor + s.alpha + ')');
                        gradient.addColorStop(1, colors.shootingColor + '0)');
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 1.2;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(tailX, tailY);
                        ctx.stroke();

                        ctx.fillStyle = colors.shootingColor + Math.min(1, s.alpha * 1.5) + ')';
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                function animate() {
                    time++;
                    ctx.clearRect(0, 0, width, height);
                    const colors = getThemeColors();

                    for (const star of stars) {
                        drawStar(star, colors);
                    }

                    drawConnections(colors);
                    drawShootingStars(colors);

                    animationId = requestAnimationFrame(animate);
                }

                function scheduleShootingStars() {
                    const delay = Math.random() * 3000 + 5000;
                    setTimeout(() => {
                        spawnShootingStar();
                        scheduleShootingStars();
                    }, delay);
                }

                resize();
                if (!reduceMotion) {
                    animate();
                    scheduleShootingStars();
                }

                window.addEventListener('resize', () => {
                    cancelAnimationFrame(animationId);
                    resize();
                    if (!reduceMotion) animate();
                });

                // 主题切换时重新绘制（轻量刷新）
                const themeObserver = new MutationObserver(() => {
                    if (!reduceMotion && animationId === null) {
                        animate();
                    }
                });
                themeObserver.observe(htmlEl, { attributes: true, attributeFilter: ['data-theme'] });
            }

            // ==================== INIT ====================
            renderAll();
            updateBackToTop();
            initStarfield();

            // ==================== SERVICE WORKER REGISTRATION (OFFLINE SUPPORT) ====================
            // Not using external SW, but page is fully self-contained so it works offline naturally.

            console.log('✅ 简历页面已就绪 | 徐浩渊 | ' + resume.lastUpdated);
            console.log('📧 联系邮箱：' + fullEmail);
            console.log('🖨 点击右上角打印按钮或使用 Ctrl+P / Cmd+P 导出PDF');
            console.log('🌓 支持深色/浅色模式切换，自动跟随系统偏好');

            // 填充 section 编号前缀（航天星图风格）
            const sectionNumbering = {
                'highlights': '00 //',
                'experience': '01 //',
                'projects': '02 //',
                'skills': '03 //',
                'education': '04 //',
                'certificates': '05 //',
                'self-eval': '06 //',
            };
            document.querySelectorAll('.section-prefix').forEach(el => {
                const id = el.dataset.sectionId;
                el.textContent = sectionNumbering[id] || '◆';
            });

            // 飞机大战游戏弹窗
            const gameModal = document.getElementById('gameModal');
            const gameModalTitle = document.getElementById('gameModalTitle');
            const gameModalIframe = document.getElementById('gameModalIframe');
            const gameModalClose = document.getElementById('gameModalClose');

            // 将键盘焦点交给游戏 iframe 内部容器。
            // 说明：iframe 内部脚本自行 focus() 在「首次用户激活」前可能被浏览器拒绝，
            // 因此必须由父页面在用户手势内聚焦 iframe，并在其 load 后再次确认焦点。
            function focusGameIframe() {
                if (!gameModalIframe) return;
                // 弹窗未激活时（如关闭时 src 置为 about:blank 触发的 load 事件）不做聚焦，
                // 避免对已隐藏的 iframe 产生无意义的焦点操作
                if (gameModal && !gameModal.classList.contains('active')) return;
                try {
                    // contentWindow 在 file:// 协议下同样可能被安全策略限制，需一并捕获
                    const iw = gameModalIframe.contentWindow;
                    if (iw && typeof iw.focus === 'function') {
                        try { iw.focus(); } catch (_) {}
                    }
                    const idoc = gameModalIframe.contentDocument;
                    if (idoc) {
                        const gc = idoc.getElementById('gameContainer');
                        if (gc && typeof gc.focus === 'function') {
                            gc.focus();
                            return;
                        }
                    }
                } catch (err) {
                    // 跨域 / 安全限制：静默降级，交由下方兜底聚焦
                }
                // 兜底：聚焦 iframe 元素本身，浏览器仍会向其文档路由键盘事件
                try { gameModalIframe.focus(); } catch (_) {}
            }
            function openGameModal(href, label) {
                if (!gameModalIframe) return;
                // 防御：data-game-href 缺失时回退到默认游戏页
                href = href || 'plane.html';
                // 安全：防止 iframe 加载当前页自身，在 file:// 下会触发跨域报错
                if (href === '' || href.toLowerCase() === 'index.html' || href === location.pathname.split('/').pop()) {
                    console.warn('openGameModal: 拒绝加载当前页作为 iframe src，回退到 plane.html');
                    href = 'plane.html';
                }
                rememberFocus();
                gameModalTitle.textContent = label || '星河战机';
                // 附加版本参数，防止 iframe 命中浏览器缓存的旧版游戏页面（旧版无键盘焦点修复）
                gameModalIframe.src = href + (href.includes('?') ? '&' : '?') + 'v=20260817';
                gameModal.classList.add('active');
                gameModal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                // 优先把键盘焦点交给游戏 iframe（处于用户点击手势内，浏览器允许转移焦点），
                // 使方向键 / WASD 立即可用；若浏览器拒绝则回退到关闭按钮，仍满足弹窗焦点管理。
                try { gameModalIframe.focus(); } catch (e) {}
                if (gameModalClose && document.activeElement !== gameModalIframe) gameModalClose.focus();
            }
            function closeGameModal() {
                if (!gameModal) return;
                gameModal.classList.remove('active');
                gameModal.setAttribute('aria-hidden', 'true');
                // 用 about:blank 卸载 iframe：about:blank 继承父文档的源，在 file:/// 协议下不会触发
                // "file: URLs are treated as unique security origins" 拦截；
                // 而空串 / 当前页 URL 作为 src 时，Chrome 在本地协议下可能把 iframe 解析为自身页面导致跨域报错。
                // 下次打开时 openGameModal 会重新动态赋值 src，此处无需预载任何内容。
                if (gameModalIframe) gameModalIframe.src = 'about:blank';
                document.body.style.overflow = '';
                restoreFocus();
            }
            if (gameModalClose) {
                gameModalClose.addEventListener('click', closeGameModal);
            }
            if (gameModal) {
                trapFocus(gameModal);
                gameModal.addEventListener('click', e => {
                    if (e.target === gameModal) closeGameModal();
                });
            }
            // iframe 加载完成后再次聚焦游戏容器，覆盖异步加载导致的焦点竞态
            if (gameModalIframe) {
                gameModalIframe.addEventListener('load', focusGameIframe);
            }
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && gameModal && gameModal.classList.contains('active')) closeGameModal();
            });

            // 绑定所有游戏启动按钮
            document.addEventListener('click', e => {
                const btn = e.target.closest('.game-launch-btn');
                if (btn) {
                    e.preventDefault();
                    const href = btn.dataset.gameHref;
                    const label = btn.dataset.gameLabel || '星河战机';
                    openGameModal(href, label);
                }
            });

        })();
    </script>
</body>
</html>
