<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · 经典核心框架</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #05070d;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
    }
    .hud {
        width: min(676px, 96vw);
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }
    .hud .item {
        flex: 1;
        background: rgba(15, 23, 42, .92);
        border: 1px solid rgba(250, 204, 21, .25);
        border-radius: 10px;
        padding: 7px 14px;
        font-size: 13px;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: .5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .hud .item b { color: #facc15; font-size: 16px; }
    .hud .item.lives b { color: #f87171; }
    .hud .item.enemies b { color: #fb923c; }
    .viewport {
        width: min(676px, 96vw);
        border: 2px solid rgba(250, 204, 21, .35);
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(250, 204, 21, .08);
        background: #0a0f1c;
        overflow: hidden;
    }
    canvas {
        display: block;
        width: 100%;
        height: auto;    /* 等比缩放，适配窗口 / iframe 任意尺寸 */
    }
    .tips {
        margin-top: 10px;
        font-size: 12px;
        color: #64748b;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: min(676px, 96vw);
    }
    .tips kbd {
        background: #111a2c;
        border: 1px solid #243350;
        border-bottom-width: 2px;
        padding: 2px 7px;
        border-radius: 5px;
        color: #cbd5e1;
        font-size: 11px;
    }

    /* ======================= 主菜单 ======================= */
    .menu-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, rgba(10, 15, 28, .68), rgba(2, 6, 23, .92));
        backdrop-filter: blur(3px);
    }
    .menu-overlay.visible { display: flex; }
    .menu-panel {
        width: 660px;
        max-height: 94vh;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(15, 23, 42, .97), rgba(10, 15, 28, .97));
        border: 1px solid rgba(250, 204, 21, .35);
        border-radius: 16px;
        box-shadow: 0 0 60px rgba(250, 204, 21, .12), 0 20px 60px rgba(0, 0, 0, .6);
        padding: 26px 36px 30px;
        text-align: center;
    }
    .menu-title {
        font-size: 50px;
        font-weight: 900;
        letter-spacing: 10px;
        color: #facc15;
        text-shadow: 0 0 24px rgba(250, 204, 21, .45), 0 4px 0 #92400e;
        margin-bottom: 2px;
    }
    .menu-sub {
        color: #64748b;
        font-size: 12px;
        letter-spacing: 5px;
        margin-bottom: 14px;
    }
    .menu-label {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #94a3b8;
        font-size: 12px;
        letter-spacing: 2px;
        margin: 16px 0 10px;
    }
    .menu-label::before, .menu-label::after { content: ''; flex: 1; height: 1px; background: rgba(148, 163, 184, .2); }
    .diff-row { display: flex; gap: 10px; justify-content: center; }
    .diff-btn {
        flex: 1;
        max-width: 150px;
        padding: 10px 0;
        background: #0f172a;
        border: 1px solid #243350;
        border-radius: 10px;
        color: #cbd5e1;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all .15s;
    }
    .diff-btn:hover { border-color: #facc15; color: #fde047; }
    .diff-btn.active {
        background: linear-gradient(180deg, #facc15, #d97706);
        border-color: #facc15;
        color: #1e293b;
        box-shadow: 0 0 18px rgba(250, 204, 21, .35);
    }
    .diff-desc { margin-top: 10px; font-size: 12px; color: #94a3b8; min-height: 16px; }
    .start-btn {
        margin: 20px auto 6px;
        display: block;
        width: 270px;
        padding: 14px 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 6px;
        background: linear-gradient(180deg, #facc15, #d97706);
        color: #1e293b;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 0 24px rgba(250, 204, 21, .3), inset 0 2px 0 rgba(255, 255, 255, .4);
        transition: transform .12s, box-shadow .12s;
    }
    .start-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 28px rgba(250, 204, 21, .45), inset 0 2px 0 rgba(255, 255, 255, .4);
    }
    .start-btn:active { transform: translateY(0); }
    .guide {
        display: flex;
        gap: 26px;
        justify-content: center;
        text-align: left;
        background: rgba(2, 6, 23, .4);
        border: 1px solid rgba(148, 163, 184, .12);
        border-radius: 10px;
        padding: 12px 18px;
    }
    .guide-col { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .guide-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #cbd5e1; }
    .guide-row kbd {
        min-width: 74px;
        text-align: center;
        background: #111a2c;
        border: 1px solid #243350;
        border-bottom-width: 2px;
        padding: 1px 7px;
        border-radius: 5px;
        color: #e2e8f0;
        font-size: 11px;
    }
    .guide-row span { color: #94a3b8; }

    /* ============ 内嵌 / 移动端响应式 ============ */
    .menu-panel {
        max-width: 92vw;
    }
    .menu-title { font-size: clamp(30px, 8vw, 50px); letter-spacing: clamp(4px, 2vw, 10px); }

    /* ============ 触屏虚拟操控（仅触屏设备显示） ============ */
    #touchUI {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
    }
    body.touch #touchUI { display: flex; }
    #touchPad {
        display: grid;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(2, 54px);
        gap: 5px;
        pointer-events: auto;
    }
    #touchPad .tp-btn:nth-child(1) { grid-column: 2; grid-row: 1; }   /* 上 */
    #touchPad .tp-btn:nth-child(2) { grid-column: 1; grid-row: 2; }   /* 左 */
    #touchPad .tp-btn:nth-child(3) { grid-column: 2; grid-row: 2; }   /* 下 */
    #touchPad .tp-btn:nth-child(4) { grid-column: 3; grid-row: 2; }   /* 右 */
    .tp-btn {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: rgba(15, 23, 42, .55);
        border: 1px solid rgba(250, 204, 21, .4);
        color: #fde047;
        font-size: 22px;
        line-height: 1;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: none;
    }
    .tp-btn:active { background: rgba(250, 204, 21, .4); }
    #touchBtns {
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: auto;
    }
    #touchBtns button {
        width: 88px;
        height: 56px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 2px;
        border: 1px solid rgba(250, 204, 21, .5);
        background: rgba(217, 119, 6, .45);
        color: #fff;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: none;
    }
    #touchBtns button:active { background: rgba(250, 204, 21, .55); }
</style>
</head>
<body>

    <!-- ======================= HUD 信息栏 ======================= -->
    <div class="hud">
        <div class="item">分数 <b id="hudScore">0</b></div>
        <div class="item lives">生命 <b id="hudLives">3</b></div>
        <div class="item enemies">敌机 <b id="hudEnemies">12</b></div>
        <div class="item">波次 <b id="hudWave">1</b></div>
        <div class="item">火力 <b id="hudLevel">★</b></div>
    </div>

    <div class="viewport">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- ======================= 主菜单 ======================= -->
    <div id="menuOverlay" class="menu-overlay">
        <div class="menu-panel">

    <div class="tips">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动
        <kbd>空格</kbd> 开火

        <span style="color:#475569">击毁敌坦掉落道具</span> ⭐升级 💣清屏 ⏰冻结 🛡️护盾 🪓加固基地
    </div>

    <!-- ======================= 触屏虚拟操控 ======================= -->
    <div id="touchUI">
        <div id="touchPad">
            <button class="tp-btn" data-code="ArrowUp">▲</button>
            <button class="tp-btn" data-code="ArrowLeft">◀</button>

            <button id="touchFire">开火</button>
            <button id="touchPause">暂停</button>

    </div>

<script>
'use strict';
/* ============================================================================
 * 坦克大战 · 经典核心框架（Battle City Core Framework）
 * 原生 HTML5 Canvas 2D + JavaScript 单文件实现
 *
 * 模块划分：
 *   SoundFX         程序化音效（WebAudio 合成）
 *   ParticleSystem  粒子特效（枪口火花 / 碎砖 / 钢墙火花 / 爆炸）
 *   TileMap         26×26 瓦片网格地图（0空地 1砖 2钢 3水 4草）
 *   Tank / PlayerTank / EnemyTank   坦克类（AABB 碰撞 + 网格对齐转向）
 *   Bullet          子弹（碎砖 / 钢墙火花 / 子弹对撞抵消）
 *   GameEngine      引擎（requestAnimationFrame 固定步长主循环）
 * ========================================================================== */

/* ============================== 1. 常量与工具 ============================== */
const TILE = 26;                 // 瓦片像素尺寸
const ROWS = 26;                 // 地图行数
const COLS = 26;                 // 地图列数（26×26 网格）
const W = TILE * COLS;           // 画布逻辑宽 676
const H = TILE * ROWS;           // 画布逻辑高 676

// 瓦片类型定义
const TILE_EMPTY = 0;   // 空地
const TILE_BRICK = 1;   // 普通砖墙（子弹可击碎）
const TILE_STEEL = 2;   // 钢铁墙（不可摧毁）
const TILE_WATER = 3;   // 水面（阻挡坦克，子弹可穿过）
const TILE_GRASS = 4;   // 草丛（坦克与子弹可穿过，提供隐蔽）

// 四方向枚举
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DIR_VEC = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 方向 -> 单位向量

// 通用工具
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

// AABB 轴对齐包围盒相交检测
function aabb(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x2 < x1 + w1 && y1 < y2 + h2 && y2 < y1 + h1;
}
// 圆（子弹）与矩形（坦克）相交检测
function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
}
// 多角星路径（道具 ⭐ / 基地徽章）
function starPath(ctx, cx, cy, spikes, outer, inner) {
    let rot = -Math.PI / 2;
    const step = Math.PI / spikes;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
        const rr = i % 2 === 0 ? outer : inner;
        ctx.lineTo(cx + Math.cos(rot) * rr, cy + Math.sin(rot) * rr);
        rot += step;
    }
    ctx.closePath();
}

/* ============================ 2. 程序化音效 ============================ */
class SoundFX {
    constructor() { this.ctx = null; this.muted = false; this.noiseBuf = null; }
    /* 首次用户交互时创建 / 恢复音频上下文（浏览器自动播放策略） */
    ensure() {
        if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }
    /* 生成一段可复用的白噪声 buffer */
    _noise() {
        if (this.noiseBuf) return this.noiseBuf;
        const c = this.ctx, len = Math.floor(c.sampleRate * 0.5);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
        return buf;
    }
    play(fn) {
        if (this.muted) return;
        this.ensure();
        if (!this.ctx || this.ctx.state !== 'running') return;
        fn(this.ctx);
    }
    /* 振荡器音调：freq0 -> freq1 频率滑落 */
    tone(freq0, freq1, dur, type, vol) {
        this.play(c => {
            const t = c.currentTime;
            const o = c.createOscillator(), g = c.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq0, t);
            o.frequency.exponentialRampToValueAtTime(Math.max(1, freq1), t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.connect(g).connect(c.destination);
            o.start(t); o.stop(t + dur + 0.02);
        });
    }
    /* 滤波噪声：模拟碰撞 / 爆炸的瞬时冲击 */
    noise(dur, vol, f0, f1, type = 'lowpass') {
        this.play(c => {
            const t = c.currentTime;
            const src = c.createBufferSource(); src.buffer = this._noise();
            const f = c.createBiquadFilter(); f.type = type;
            f.frequency.setValueAtTime(f0, t);
            f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
            const g = c.createGain();
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            src.connect(f).connect(g).connect(c.destination);
            src.start(t); src.stop(t + dur + 0.02);
        });
    }
    shoot() { this.tone(760, 180, 0.14, 'square', 0.16); this.noise(0.05, 0.06, 3000, 800, 'bandpass'); }
    brick() { this.noise(0.1, 0.22, 1600, 300); this.tone(220, 90, 0.08, 'triangle', 0.14); }
    steel() { this.tone(1400, 700, 0.07, 'square', 0.11); this.tone(2100, 1500, 0.05, 'square', 0.06); }
    boom() { this.noise(0.5, 0.5, 900, 80); this.tone(160, 40, 0.45, 'sine', 0.4); }
    ping() { this.tone(1300, 900, 0.08, 'sine', 0.2); }
    spawn() { this.tone(300, 900, 0.25, 'triangle', 0.12); }
    powerup() { this.tone(520, 1040, 0.18, 'square', 0.14); this.tone(780, 1560, 0.22, 'square', 0.1); }
    freeze() { this.tone(900, 300, 0.3, 'sine', 0.18); this.tone(1400, 500, 0.4, 'triangle', 0.1); }
    shovel() { this.noise(0.15, 0.3, 600, 1200, 'bandpass'); this.tone(400, 200, 0.2, 'square', 0.14); }
    shield() { this.tone(300, 900, 0.25, 'sine', 0.16); this.tone(600, 1200, 0.3, 'sine', 0.1); }
    explode() { this.noise(0.7, 0.6, 700, 50); this.tone(120, 30, 0.6, 'sawtooth', 0.3); }
}

/* ============================ 3. 粒子特效系统 ============================ */
class ParticleSystem {
    constructor() { this.list = []; }
    spawn(o) {
        this.list.push({
            x: o.x, y: o.y,
            vx: o.vx || 0, vy: o.vy || 0,
            life: o.life !== undefined ? o.life : 0.4,
            age: 0,
            size: o.size || 3,
            color: o.color || '#fff',
            grav: o.grav || 0,
            drag: o.drag || 0
        });
    }
    /* 环形爆发：n 个粒子，随机角度与速度 */
    burst(x, y, n, o) {
        o = o || {};
        const lo = o.lifeMin !== undefined ? o.lifeMin : (o.life !== undefined ? o.life : 0.3);
        const hi = o.lifeMax !== undefined ? o.lifeMax : (o.life !== undefined ? o.life : 0.6);
        const colors = Array.isArray(o.color) ? o.color : [o.color || '#fff'];
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(o.speedMin !== undefined ? o.speedMin : 20, o.speedMax !== undefined ? o.speedMax : 160);
            this.spawn({
                x, y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
                life: rand(lo, hi),
                size: rand(o.sizeMin !== undefined ? o.sizeMin : (o.size || 2), o.sizeMax !== undefined ? o.sizeMax : (o.size || 4)),
                color: colors[(Math.random() * colors.length) | 0],
                grav: o.grav || 0,
                drag: o.drag || 0
            });
        }
    }
    update(dt) {
        const list = this.list;
        for (let i = list.length - 1; i >= 0; i--) {
            const p = list[i];
            p.age += dt;
            if (p.age >= p.life) { list.splice(i, 1); continue; }
            const dr = Math.max(0, 1 - p.drag * dt);
            p.vx *= dr; p.vy *= dr;
            p.vy += p.grav * dt;
            p.x += p.vx * dt; p.y += p.vy * dt;
        }
    }
    draw(ctx) {
        if (!this.list.length) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';   // 叠加发光，增强打击感
        for (const p of this.list) {
            ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }
}

/* ============================ 4. 地图网格系统 ============================ */
class TileMap {
    constructor() {
        this.rows = ROWS;
        this.cols = COLS;
        this.grid = [];
    }

    /* 生成一张左右对称的经典风格地图（26×26） */
    init() {
        this.grid = Array.from({ length: this.rows }, () => Array(this.cols).fill(TILE_EMPTY));
        // 在 (r,c) 放置一块 h×w 的矩形区域
        const rect = (r, c, h, w, t) => {
            for (let i = 0; i < h; i++)
                for (let j = 0; j < w; j++) this.set(r + i, c + j, t);
        };
        // 左右镜像辅助：在 (r,c) 与 (r, cols-c-w) 各放置一块（保证对称）
        const mirror = (r, c, h, w, t) => { rect(r, c, h, w, t); rect(r, this.cols - c - w, h, w, t); };

        // 1) 外圈钢铁墙（不可破坏的边界）
        rect(0, 0, 1, this.cols, TILE_STEEL);
        rect(this.rows - 1, 0, 1, this.cols, TILE_STEEL);
        rect(0, 0, this.rows, 1, TILE_STEEL);
        rect(0, this.cols - 1, this.rows, 1, TILE_STEEL);

        // 2) 砖墙掩体（顶部与底部保留对称布置，中央区域让位给 XHY 字母矩阵）
        mirror(2, 2, 2, 2, TILE_BRICK);      // 顶部两角
        mirror(2, 13, 2, 4, TILE_BRICK);     // 顶部中央砖排
        mirror(4, 4, 2, 2, TILE_BRICK);
        mirror(4, 17, 2, 2, TILE_BRICK);
        mirror(6, 2, 2, 2, TILE_BRICK);
        mirror(6, 10, 2, 2, TILE_BRICK);
        mirror(18, 11, 2, 4, TILE_BRICK);    // 底部中央砖排

        // 3) 水面（阻挡坦克，子弹可穿过；上移至行5~6、下移至行17~18，
        //    避开行 8~16 的 XHY 字母矩阵）
        mirror(5, 2, 2, 4, TILE_WATER);
        mirror(17, 3, 2, 3, TILE_WATER);

        // 4) 草丛（隐蔽，绘制在最上层）
        mirror(19, 8, 2, 2, TILE_GRASS);
        mirror(21, 4, 2, 3, TILE_GRASS);
        rect(21, 11, 2, 4, TILE_GRASS);

        // 5) 中央 XHY 姓名缩写矩阵（满分加分项，见 buildXHYMatrix）
        this.buildXHYMatrix();

        // 6) 基地外围一圈砖墙护盾（每个方块可抵御敌方一次进攻）
        this.buildBaseDefense();
    }

    /* 中央 XHY 姓名缩写地图矩阵：
       行 8~16、列 4~21 区域内，用钢墙(#)拼出 X / H / Y 三个大写字母轮廓，
       字母内部用砖墙(o)点缀（可被击碎进入字母内部），
       字母之间保留 1 格走廊（列 9 / 列 15），保证坦克穿行、交火与卡位。 */
    buildXHYMatrix() {
        const ST = TILE_STEEL, BR = TILE_BRICK;
        // 5 列宽 × 9 行高 的字母模板：'#' 钢墙  'o' 砖墙  '.' 空地
        const X = [
            '##.##',
            '##.##',
            '.###.',
            '.###.',
            '.###.',
            '.###.',
            '##.##',
            '##.##',
            '#ooo#',
        ];
        const H = [
            '#...#',
            '#...#',
            '#.o.#',
            '#.o.#',
            '#####',
            '#...#',
            '#...#',
            '#.o.#',
            '#.o.#',
        ];
        const Y = [
            '##.##',
            '##.##',
            '.###.',
            '..#..',
            '..#..',
            '..#..',
            '..#..',
            '.o#o.',
            '.o#o.',
        ];
        const place = (r0, c0, art) => {
            for (let i = 0; i < art.length; i++) {
                for (let j = 0; j < art[i].length; j++) {
                    const ch = art[i][j];
                    if (ch === '#') this.set(r0 + i, c0 + j, ST);
                    else if (ch === 'o') this.set(r0 + i, c0 + j, BR);
                }
            }
        };
        place(8, 4, X);      // X：列 4~8
        place(8, 10, H);     // H：列 10~14（列 9 为走廊）
        place(8, 16, Y);     // Y：列 16~20（列 15 为走廊）
    }

    /* 基地护盾：在基地周围 (r-1..r+h) × (c-1..c+w) 铺一整圈 TILE_BRICK，
       除基地本体所占的 2×4 格外。普通砖块一次子弹击碎，构成薄防护层。
       直接覆盖该范围内的草丛 / 空格，保证上方、左右、下方完整一圈 */
    buildBaseDefense() {
        const base = { r: ROWS - 3, c: 11, h: 2, w: 4 };
        for (let r = base.r - 1; r <= base.r + base.h; r++) {
            for (let c = base.c - 1; c <= base.c + base.w; c++) {
                // 基地本体格子保持为空（坦克不可进入由 collides 单独处理）
                if (r >= base.r && r < base.r + base.h && c >= base.c && c < base.c + base.w) continue;
                // 最外层是不可破坏的钢墙，不覆盖
                if (r <= 0 || r >= this.rows - 1 || c <= 0 || c >= this.cols - 1) continue;
                this.set(r, c, TILE_BRICK);
            }
        }
    }

    /* 读取瓦片（越界一律视为钢墙，防止坦克 / 子弹逃逸） */
    get(r, c) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return TILE_STEEL;
        return this.grid[r][c];
    }
    /* 写入瓦片 */
    set(r, c, t) {
        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) this.grid[r][c] = t;
    }
    /* 对坦克而言的实体瓦片：砖墙 / 钢墙 / 水面 */
    isSolidForTank(r, c) {
        const t = this.get(r, c);
        return t === TILE_BRICK || t === TILE_STEEL || t === TILE_WATER;
    }

    /* ---------------- 瓦片绘制（ctx 显式传参，避免依赖全局变量） ---------------- */
    drawBrick(ctx, px, py) {
        ctx.fillStyle = '#9a4314'; ctx.fillRect(px, py, TILE, TILE);       // 底色
        ctx.fillStyle = '#6b2c08';                                          // 砖缝（灰浆色）
        ctx.fillRect(px, py + 12, TILE, 2);                                 // 横向缝
        ctx.fillRect(px + 12, py, 2, 12);                                   // 上排竖缝
        ctx.fillRect(px + 6, py + 14, 2, 10);                               // 下排竖缝（交错）
        ctx.fillStyle = 'rgba(255,255,255,0.14)';                           // 高光
        ctx.fillRect(px + 1, py + 1, 11, 2);
        ctx.fillRect(px + 15, py + 15, 10, 2);
    }
    drawSteel(ctx, px, py) {
        ctx.fillStyle = '#55606e'; ctx.fillRect(px, py, TILE, TILE);        // 钢板
        ctx.fillStyle = '#7c8896';                                          // 高光边
        ctx.fillRect(px + 2, py + 2, TILE - 4, 3);
        ctx.fillRect(px + 2, py + 2, 3, TILE - 4);
        ctx.fillStyle = '#2f3844';                                          // 阴影边
        ctx.fillRect(px + 2, py + TILE - 5, TILE - 4, 3);
        ctx.fillRect(px + TILE - 5, py + 2, 3, TILE - 4);
        ctx.fillStyle = '#2f3844'; ctx.fillRect(px + 11, py + 11, 4, 4);    // 铆钉
        ctx.fillStyle = '#9aa7b5'; ctx.fillRect(px + 12, py + 12, 2, 2);
    }
    drawWater(ctx, px, py, t) {
        ctx.fillStyle = '#0b4a6f'; ctx.fillRect(px, py, TILE, TILE);
        ctx.save();
        ctx.beginPath(); ctx.rect(px, py, TILE, TILE); ctx.clip();          // 波纹限制在瓦片内
        ctx.fillStyle = 'rgba(56,189,248,0.45)';
        for (let k = 0; k < 2; k++) {                                       // 两层随正弦波流动的亮纹
            const off = py + 7 + k * 12 + Math.sin(t * 2.4 + px * 0.045 + k * 2) * 2.2;
            ctx.fillRect(px + 1, off, TILE - 2, 3);
        }
        ctx.restore();
    }
    drawGrass(ctx, px, py, t) {
        ctx.fillStyle = 'rgba(21,78,38,0.55)'; ctx.fillRect(px, py, TILE, TILE);
        ctx.strokeStyle = 'rgba(74,222,128,0.85)';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 5; i++) {                                       // 草丛摆动
            const gx = px + 3 + i * 5, base = py + 8 + ((i * 7) % 4) * 4;
            const sway = Math.sin(t * 2 + i) * 1.2;
            ctx.beginPath(); ctx.moveTo(gx, base + 7);
            ctx.lineTo(gx + sway, base - 3);
            ctx.stroke();
        }
    }

    /* 绘制除草丛外的所有瓦片 */
    draw(ctx, t) {
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                const tile = this.grid[r][c];
                if (tile === TILE_EMPTY) continue;
                const px = c * TILE, py = r * TILE;
                if (tile === TILE_BRICK) this.drawBrick(ctx, px, py);
                else if (tile === TILE_STEEL) this.drawSteel(ctx, px, py);
                else if (tile === TILE_WATER) this.drawWater(ctx, px, py, t);
            }
        }
    }
    /* 草丛单独绘制（覆盖在坦克 / 子弹之上，实现隐蔽） */
    drawGrassLayer(ctx, t) {
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                if (this.grid[r][c] === TILE_GRASS) this.drawGrass(ctx, c * TILE, r * TILE, t);
            }
        }
    }
}

/* ============================ 5. 坦克基类 ============================ */
class Tank {
    constructor(game, x, y, size, dir) {
        this.game = game;        // 引擎引用（访问地图 / 坦克列表 / 特效）
        this.x = x;              // 左上角像素坐标
        this.y = y;
        this.size = size;
        this.dir = dir;          // 当前朝向
        this.speed = 0;          // 像素/秒
        this.hp = 1;
        this.fireCd = 0;         // 开火冷却（秒）
        this.invincible = 0;     // 无敌时间（秒），刷新保护
        this.bodyColor = '#d99a06';
        this.accent = '#fde047';
        this.isPlayer = false;
        this.active = true;      // 存活标记
    }
    center() { return [this.x + this.size / 2, this.y + this.size / 2]; }

    /* 转向：切换方向时自动对齐网格（垂直走位对齐 X，水平走位对齐 Y），避免卡墙角 */
    turn(nd) {
        if (nd === this.dir) return;
        const ox = this.x, oy = this.y;
        this.dir = nd;
        if (nd === DIR.UP || nd === DIR.DOWN) this.x = Math.round(this.x / TILE) * TILE;
        else this.y = Math.round(this.y / TILE) * TILE;
        // 若对齐导致卡进障碍则回退（保持方向，等待继续调整）
        if (this.collides(this.x, this.y)) { this.x = ox; this.y = oy; }
    }

    /* 按当前方向前进（X / Y 轴分离检测，实现贴墙滑动） */
    move(dt) {
        const step = this.speed * dt;
        const [dx, dy] = DIR_VEC[this.dir];
        const nx = this.x + dx * step, ny = this.y + dy * step;
        if (!this.collides(nx, this.y)) this.x = nx;
        if (!this.collides(this.x, ny)) this.y = ny;
    }

    /* AABB 碰撞：边界 / 实体瓦片 / 其它坦克 */
    collides(x, y) {
        if (x < 0 || y < 0 || x + this.size > W || y + this.size > H) return true;
        const tm = this.game.tileMap;
        const l = Math.floor(x / TILE), r = Math.floor((x + this.size - 0.01) / TILE);
        const t = Math.floor(y / TILE), b = Math.floor((y + this.size - 0.01) / TILE);
        for (let row = t; row <= b; row++) {
            for (let col = l; col <= r; col++) {
                if (tm.isSolidForTank(row, col)) return true;
            }
        }
        // 基地本体为实体，坦克不可进入
        const bs = this.game.base;
        if (bs.alive && aabb(x, y, this.size, this.size, bs.c * TILE, bs.r * TILE, bs.w * TILE, bs.h * TILE)) return true;
        for (const tk of this.game.allTanks()) {
            if (tk === this || !tk.active) continue;
            if (aabb(x, y, this.size, this.size, tk.x, tk.y, tk.size, tk.size)) return true;
        }
        return false;
    }

    /* 被子弹击中 */
    hit(bullet) {
        const g = this.game;
        this.hp--;
        const [cx, cy] = this.center();
        if (this.hp <= 0) {
            // 殉爆：火球粒子 + 闪光环 + 震屏 + 顿帧
            g.particles.burst(cx, cy, 26, { color: ['#fef08a', '#fb923c', '#ef4444', '#fff7ed'], life: 0.6, size: 4, grav: 120, drag: 2 });
            g.flashes.push({ x: cx, y: cy, r: 34, life: 0.35, max: 0.35 });
            g.shake = Math.max(g.shake, 8);
            g.freeze = Math.max(g.freeze, 0.05);
            g.sound.boom();
            if (this.isPlayer) {
                this.active = false;
                g.hurtFlash = 0.5;                   // 玩家殉爆 -> 屏幕红闪
                g.lives--;
                if (g.lives < 0) g.state = 'over';   // 生命耗尽，游戏结束
                else this.respawn();                 // 重生并进入 3 秒无敌
            } else {
                g.killEnemy(this);                   // 敌人统一由引擎处理（计分 / 掉落 / 特效）
            }
        } else {
            // 非致命受击：火花 + 轻震
            g.particles.burst(cx, cy, 8, { color: '#fbbf24', life: 0.3, size: 2.5 });
            g.shake = Math.max(g.shake, 2);
            if (this.kind === 'heavy') {             // 重装坦克：随剩余血量逐级变色
                this.bodyColor = this.hp === 2 ? '#c2410c' : '#b91c1c';
                g.sound.steel();
            }
        }
    }

    /* 玩家重生（出生在基地护盾左侧 c=6，护盾 c=10..15 之外） */
    respawn() {
        this.x = 6 * TILE; this.y = (ROWS - 2) * TILE;
        this.dir = DIR.UP; this.hp = 1; this.active = true;
        this.invincible = 3; this.fireCd = 0.5;
    }

    update(dt) {
        if (!this.active) return;
        this.move(dt);
    }

    /* 绘制坦克（按方向旋转，炮口朝上为基准） */
    draw(ctx) {
        if (!this.active) return;
        ctx.save();
        if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0) ctx.globalAlpha = 0.4;
        ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
        ctx.rotate(this.dir * Math.PI / 2);
        // 左右履带
        ctx.fillStyle = '#16202e';
        ctx.fillRect(-this.size / 2 - 2, -this.size / 2 - 1, 4, this.size + 2);
        ctx.fillRect(this.size / 2 - 2, -this.size / 2 - 1, 4, this.size + 2);
        // 车体
        ctx.fillStyle = this.bodyColor;
        ctx.fillRect(-this.size / 2 + 2, -this.size / 2, this.size - 4, this.size);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';   // 车体高光
        ctx.fillRect(-this.size / 2 + 3, -this.size / 2 + 2, this.size - 6, 3);
        // 炮塔
        ctx.fillStyle = this.accent;
        ctx.beginPath(); ctx.arc(0, 0, this.size * 0.24, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(0, 0, this.size * 0.12, 0, Math.PI * 2); ctx.fill();
        // 炮管（向上伸出）
        ctx.fillStyle = '#334155';
        ctx.fillRect(-2, -this.size / 2 - 4, 4, this.size / 2 + 5);
        ctx.restore();
        ctx.globalAlpha = 1;
        // 无敌护盾光环
        if (this.invincible > 0) {
            ctx.save();
            ctx.globalAlpha = 0.45 + 0.3 * Math.sin(this.game.time * 10);
            ctx.strokeStyle = '#7dd3fc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size * 0.85, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }
}

/* ============================ 6. 玩家坦克 ============================ */
class PlayerTank extends Tank {
    constructor(game, x, y) {
        super(game, x, y, 24, DIR.UP);
        this.isPlayer = true;
        this.level = 1;                   // 火力等级（1~3，拾取 ⭐ 进阶）
        this.maxBullets = 6;              // 同屏最大存活子弹数限制（双发需更多槽位）
        this.hp = 1;
        this.applyLevel(1);
    }
    /* 按火力等级应用射速 / 移速（Lv1 → Lv3） */
    applyLevel(lv) {
        this.level = lv;
        this.speed = 115 + (lv - 1) * 11;
        this.fireCdMax = [0.26, 0.17, 0.13][lv - 1];
    }
    update(dt) {
        if (!this.active) return;
        if (this.invincible > 0) this.invincible -= dt;
        if (this.fireCd > 0) this.fireCd -= dt;

        // 解析输入（最近按下的方向优先，避免斜向抖动）
        const nd = this.game.resolveInputDir();
        if (nd !== null) {
            if (nd !== this.dir) this.turn(nd);
            this.move(dt);
        }
        // 按住空格连续开火
        if (this.game.keys['Space'] && this.fireCd <= 0) this.shoot();
    }
    /* 开火：受冷却与同屏上限双重限制；Lv3 双发连射 */
    shoot() {
        const g = this.game;
        const mine = g.bullets.filter(b => b.owner === this).length;
        if (mine >= this.maxBullets) return;
        const shots = Math.min(this.level >= 3 ? 2 : 1, this.maxBullets - mine);
        const [dx, dy] = DIR_VEC[this.dir];
        const [cx, cy] = this.center();
        const px = -dy, py = dx;                        // 炮口垂直方向（双发左右错开）
        for (let i = 0; i < shots; i++) {
            const off = shots === 1 ? 0 : (i === 0 ? -5 : 5);
            const bx = cx + dx * (this.size / 2 + 5) + px * off;
            const by = cy + dy * (this.size / 2 + 5) + py * off;
            g.addBullet(new Bullet(g, bx, by, this.dir, 340 + this.level * 20, this, 3.5, 'player', false));
        }
        this.fireCd = this.fireCdMax;
        g.sound.shoot();
        g.particles.burst(cx + dx * (this.size / 2 + 8), cy + dy * (this.size / 2 + 8), shots * 4, { color: '#fde047', life: 0.12, size: 2, speedMin: 30, speedMax: 90 });
    }
}

/* ============================ 7. 敌人坦克 ============================ */
class EnemyTank extends Tank {
    /* 三型敌坦配置表：轻型 / 重装装甲 / 火炮突击 */
    static SPECS = {
        light:      { hp: 1, speed: [64, 104], fireCd: [0.9, 1.6], bulletSpeed: 235, bulletR: 3,   color: '#8b98a5', accent: '#cbd5e1', dropChance: 0.32, score: 100, pierce: false },
        heavy:      { hp: 3, speed: [36, 52],  fireCd: [1.1, 1.8], bulletSpeed: 215, bulletR: 3.5, color: '#d97706', accent: '#fbbf24', dropChance: 0.72, score: 300, pierce: false },
        artillery:  { hp: 1, speed: [52, 80],  fireCd: [0.45, 0.8], bulletSpeed: 290, bulletR: 3,  color: '#7f1d1d', accent: '#f87171', dropChance: 0.50, score: 200, pierce: true }
    };
    constructor(game, x, y, kind) {
        const spec = EnemyTank.SPECS[kind] || EnemyTank.SPECS.light;
        super(game, x, y, 22, DIR.DOWN);
        this.isPlayer = false;
        this.kind = kind;
        this.hp = spec.hp;
        this.score = spec.score;
        this.dropChance = spec.dropChance;
        this.bodyColor = spec.color;
        this.accent = spec.accent;
        this.invincible = 1.6;            // 刷新保护
        this.blocked = false;             // 上一步是否被卡住
        this.thinkTimer = 0;              // AI 决策计时
        const w = game.wave;
        const d = game.diffCfg || DIFFICULTY.normal;                          // 难度倍率
        this.hp = spec.hp + (d.hpBonus || 0);                                 // 高难度敌坦更耐打
        this.speed = Math.min(rand(spec.speed[0], spec.speed[1]) + w * 2, 150) * d.enemySpeed;
        this.fireCdMax = Math.max(0.3, rand(spec.fireCd[0], spec.fireCd[1]) - w * 0.05) * d.enemyFire;
        this.fireCd = this.fireCdMax * 0.5;
        this.dropChance = Math.min(1, this.dropChance * d.dropMult);          // 掉率随难度调整
    }
    update(dt) {
        if (!this.active) return;
        if (this.invincible > 0) this.invincible -= dt;
        if (this.fireCd > 0) this.fireCd -= dt;
        this.thinkTimer -= dt;

        // 被 ⏰ 时钟定身：不移动、不决策、不开火
        if (this.game.enemyFreeze > 0) return;

        // 是否已对齐网格（只在交叉口 / 对齐时决策，行为更自然）
        const alignedX = Math.abs(Math.round(this.x / TILE) * TILE - this.x) < 0.01;
        const alignedY = Math.abs(Math.round(this.y / TILE) * TILE - this.y) < 0.01;
        const aligned = alignedX && alignedY;

        if (this.blocked || (aligned && this.thinkTimer <= 0)) {
            this.chooseDir();
            this.blocked = false;
            this.thinkTimer = rand(0.25, 0.7);
        }
        // 前进
        const px = this.x, py = this.y;
        this.move(dt);
        if (this.x === px && this.y === py) this.blocked = true; // 撞墙 -> 重新选路

        // 开火：探测到玩家 / 基地立即开火，否则概率盲射
        if (this.fireCd <= 0 && aligned) {
            const mine = this.game.bullets.filter(b => b.owner === this);
            if (mine.length === 0 && (this.seesTarget() || Math.random() < 0.4)) this.shoot();
        }
    }
    /* 视线检测：当前朝向直线上的格子内是否有玩家或基地（砖/钢墙阻挡视线） */
    seesTarget() {
        const g = this.game;
        const [dx, dy] = DIR_VEC[this.dir];
        const [cx, cy] = this.center();
        const cc = Math.floor(cx / TILE), cr = Math.floor(cy / TILE);
        for (let i = 1; i < 26; i++) {
            const r = cr + dy * i, c = cc + dx * i;
            if (r < 0 || c < 0 || r >= ROWS || c >= COLS) return false;
            const t = g.tileMap.get(r, c);
            if (t === TILE_BRICK || t === TILE_STEEL) return false;
            const p = g.player;
            if (p.active && aabb(c * TILE, r * TILE, TILE, TILE, p.x, p.y, p.size, p.size)) return true;
            if (g.base.alive && r >= g.base.r && r < g.base.r + g.base.h && c >= g.base.c && c < g.base.c + g.base.w) return true;
        }
        return false;
    }
    /* AI 选路：追击玩家 / 进攻基地 / 随机巡游（不原地掉头） */
    chooseDir() {
        const g = this.game, p = g.player;
        const r = Math.random();
        if (r < 0.35 && p.active) {
            const [cx, cy] = this.center(), [pcx, pcy] = p.center();
            const dx = pcx - cx, dy = pcy - cy;
            this.dir = Math.abs(dx) > Math.abs(dy)
                ? (dx > 0 ? DIR.RIGHT : DIR.LEFT)
                : (dy > 0 ? DIR.DOWN : DIR.UP);
        } else if (r < 0.55 && g.base.alive) {
            const [cx, cy] = this.center();
            const bx = (g.base.c + g.base.w / 2) * TILE, by = (g.base.r + g.base.h / 2) * TILE;
            const dx = bx - cx, dy = by - cy;
            this.dir = Math.abs(dx) > Math.abs(dy)
                ? (dx > 0 ? DIR.RIGHT : DIR.LEFT)
                : (dy > 0 ? DIR.DOWN : DIR.UP);
        } else {
            const nd = (Math.random() * 4) | 0;
            if ((nd + 2) % 4 !== this.dir) this.dir = nd; // 避免 180° 折返
        }
        // 转向后对齐网格
        if (this.dir === DIR.UP || this.dir === DIR.DOWN) this.x = Math.round(this.x / TILE) * TILE;
        else this.y = Math.round(this.y / TILE) * TILE;
    }
    shoot() {
        const g = this.game;
        const spec = EnemyTank.SPECS[this.kind];
        const [dx, dy] = DIR_VEC[this.dir];
        const [cx, cy] = this.center();
        const bx = cx + dx * (this.size / 2 + 5), by = cy + dy * (this.size / 2 + 5);
        g.addBullet(new Bullet(g, bx, by, this.dir, spec.bulletSpeed, this, spec.bulletR, 'enemy', spec.pierce));
        this.fireCd = this.fireCdMax;
        g.sound.shoot();
        g.particles.burst(bx, by, 4, { color: '#fca5a5', life: 0.1, size: 1.5 });
    }
}
/* ============================ 8. 子弹 ============================ */
class Bullet {
    constructor(game, x, y, dir, speed, owner, r, type, pierce) {
        this.game = game;
        this.x = x; this.y = y;
        this.dir = dir;
        this.speed = speed;
        this.owner = owner;               // 发射者（用于跳过自身碰撞）
        this.r = r;
        this.type = type;                 // 'player' | 'enemy'（决定颜色）
        this.pierce = !!pierce;           // 穿透砖墙（火炮突击坦克）
        const [dx, dy] = DIR_VEC[dir];
        this.vx = dx * speed; this.vy = dy * speed;
        this.px = x; this.py = y;         // 上一帧位置（绘制拖尾）
        this.active = true;
    }
    update(dt) {
        this.px = this.x; this.py = this.y;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // 前缘检测点：精确命中即将进入的瓦片
        const [dx, dy] = DIR_VEC[this.dir];
        const fx = this.x + dx * this.r, fy = this.y + dy * this.r;
        const c = Math.floor(fx / TILE), r = Math.floor(fy / TILE);
        if (c < 0 || r < 0 || c >= COLS || r >= ROWS) { this.die(); return; }

        // 1) 坦克碰撞：按阵营判定（我方子弹只打敌人、敌方子弹只打玩家），跳过发射者与无敌坦克
        for (const tk of this.game.allTanks()) {
            if (tk === this.owner || !tk.active) continue;
            if (tk.isPlayer === (this.type === 'player')) continue;   // 同阵营跳过
            if (!circleRect(this.x, this.y, this.r, tk.x, tk.y, tk.size, tk.size)) continue;
            if (tk.invincible > 0) {
                // 玩家护盾：弹开敌方子弹（避免子弹穿透误伤身后基地）
                if (tk.isPlayer && this.type === 'enemy') {
                    this.game.particles.burst(this.x, this.y, 6, { color: '#7dd3fc', life: 0.25, size: 2 });
                    this.game.sound.ping();
                    this.die();
                }
                return;
            }
            tk.hit(this);
            this.die();
            return;
        }
        // 2) 基地碰撞（敌方弹摧毁基地；玩家弹被吸收并提示）
        if (this.game.hitBase(this)) return;

        // 3) 瓦片碰撞
        const tile = this.game.tileMap.get(r, c);
        if (tile === TILE_BRICK) {
            if (this.pierce) return;               // 火炮突击坦克：穿透砖墙继续飞行
            this.game.tileMap.set(r, c, TILE_EMPTY);
            this.onBrick(fx, fy);
            this.die();
        } else if (tile === TILE_STEEL) {
            this.onSteel(fx, fy);
            this.die();
        }
        // 水面 / 草丛 / 空地：穿透继续飞行
    }
    /* 击中砖墙：碎砖飞溅 + 轻震屏 */
    onBrick(x, y) {
        const g = this.game;
        g.particles.burst(x, y, 8, { color: ['#c25a16', '#8a3b12', '#f0b86e'], life: 0.5, size: 3, grav: 320, drag: 1 });
        g.shake = Math.max(g.shake, 1.5);
        g.sound.brick();
    }
    /* 击中钢墙：金属火花 + 震屏 + 顿帧 */
    onSteel(x, y) {
        const g = this.game;
        g.particles.burst(x, y, 9, { color: ['#fff7e6', '#fbbf24', '#94a3b8'], life: 0.35, size: 2.5, drag: 4 });
        g.shake = Math.max(g.shake, 3);
        g.freeze = Math.max(g.freeze, 0.025);
        g.sound.steel();
    }
    die() { this.active = false; }
    draw(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const rr = this.r + (this.pierce ? 1 : 0);   // 穿透弹更大更亮
        const col = this.type === 'player' ? '253,224,71,' : '248,113,113,';
        // 辉光
        ctx.fillStyle = 'rgba(' + col + '0.25)';
        ctx.beginPath(); ctx.arc(this.x, this.y, rr * 2.1, 0, Math.PI * 2); ctx.fill();
        // 拖尾
        ctx.strokeStyle = 'rgba(' + col + '0.5)';
        ctx.lineWidth = this.pierce ? 3 : 2;
        ctx.beginPath(); ctx.moveTo(this.px, this.py); ctx.lineTo(this.x, this.y); ctx.stroke();
        // 弹体 + 高亮核心
        ctx.fillStyle = this.type === 'player' ? '#fef08a' : '#fca5a5';
        ctx.beginPath(); ctx.arc(this.x, this.y, rr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = this.type === 'player' ? '#fff7cc' : '#fee2e2';
        ctx.beginPath(); ctx.arc(this.x, this.y, rr * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}
/* ============================ 9. 道具系统 ============================ */
const POWER = { STAR: 0, BOMB: 1, CLOCK: 2, SHIELD: 3, SHOVEL: 4 };

/* ============================ 9.5 难度配置 ============================ */
const DIFFICULTY = {
    easy: {
        label: '简单', lives: 5, enemies: 12, maxOnField: 4, spawnDelay: 1.0,
        enemySpeed: 0.92, enemyFire: 1.15, dropMult: 0.8, hpBonus: 0,
        desc: '生命 5 · 每波 12 敌 · 敌人较慢、掉率较低'
    },
    normal: {
        label: '普通', lives: 3, enemies: 15, maxOnField: 5, spawnDelay: 0.85,
        enemySpeed: 1.08, enemyFire: 0.85, dropMult: 1, hpBonus: 0,
        desc: '生命 3 · 每波 15 敌 · 敌人更快更准'
    },
    hard: {
        label: '困难', lives: 2, enemies: 18, maxOnField: 6, spawnDelay: 0.7,
        enemySpeed: 1.28, enemyFire: 0.68, dropMult: 1.15, hpBonus: 1,
        desc: '生命 2 · 每波 18 敌 · 敌人蜂拥而至、更耐打'
    }
};

class PowerUp {
    constructor(game, x, y, type) {
        this.game = game;
        this.x = x - 12; this.y = y - 12;   // 左上角（24×24 图标）
        this.type = type;
        this.size = 24;
        this.age = 0;
        this.life = 9;                       // 9 秒后自动消失
        this.active = true;
    }
    update(dt) {
        this.age += dt;
        if (this.age >= this.life) this.active = false;
    }
    draw(ctx) {
        if (!this.active) return;
        const last2 = this.life - this.age < 2;
        if (last2 && Math.floor(this.age * 8) % 2 === 0) return;  // 消失前快速闪烁
        ctx.save();
        ctx.translate(this.x + 12, this.y + 12);
        const s = 1 + Math.sin(this.age * 6) * 0.06;               // 悬浮脉动
        ctx.scale(s, s);
        // 底板 + 描边
        ctx.fillStyle = 'rgba(2,6,23,0.55)';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(250,204,21,0.8)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
        // 图标
        switch (this.type) {
            case POWER.STAR: {
                ctx.fillStyle = '#facc15';
                starPath(ctx, 0, 0, 5, 8, 3.6);
                ctx.fill();
                ctx.strokeStyle = '#a16207'; ctx.lineWidth = 1; ctx.stroke();
                break;
            }
            case POWER.BOMB: {
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.arc(0, 3, 7, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f87171';
                ctx.beginPath(); ctx.arc(3, -5, 3, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-2, -9); ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-2, 3, 2, 0, Math.PI * 2); ctx.fill();
                break;
            }
            case POWER.CLOCK: {
                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -5);
                ctx.moveTo(0, 0); ctx.lineTo(4, 1);
                ctx.stroke();
                break;
            }
            case POWER.SHIELD: {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.moveTo(0, -9); ctx.lineTo(7, -5); ctx.lineTo(7, 1);
                ctx.quadraticCurveTo(7, 7, 0, 10);
                ctx.quadraticCurveTo(-7, 7, -7, 1);
                ctx.lineTo(-7, -5); ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#0c4a6e'; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, Math.PI * 2); ctx.fill();
                break;
            }
            case POWER.SHOVEL: {
                ctx.strokeStyle = '#c08457'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(0, -2); ctx.stroke();
                ctx.fillStyle = '#9a4314';
                ctx.beginPath();
                ctx.moveTo(-7, -8); ctx.lineTo(7, -8); ctx.lineTo(5, -1); ctx.lineTo(-5, -1);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#6b2c08';
                ctx.fillRect(-6, -8, 4, 5);
                break;
            }
        }
        ctx.restore();
    }
}

/* ============================ 10. 游戏引擎 ============================ */
class GameEngine {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        // 高 DPI 适配（清晰锐利）；显示尺寸由 CSS 等比缩放控制（响应式 / iframe）
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * this.dpr; canvas.height = H * this.dpr;

        this.tileMap = new TileMap();
        this.particles = new ParticleSystem();
        this.sound = new SoundFX();

        this.keys = {};          // 按键按下状态
        this.keyTime = {};       // 最近按下时间（方向优先级）
        this.time = 0;           // 累计游戏时间（水面 / 草丛动画）
        this.lastT = 0;          // 上一帧时间戳
        this.acc = 0;            // 固定步长累加器
        this.freeze = 0;         // 顿帧（命中停顿，增强打击感）

        this.difficulty = 'normal';      // 当前难度：easy | normal | hard
        this.diffCfg = DIFFICULTY.normal;

        this.reset();
        this.state = 'menu';             // 初始进入主菜单
        this.showMenu();
        this.setupMenuUI();
        this.setupTouchUI();
        this.bind();
        // requestAnimationFrame 主循环启动
        requestAnimationFrame(t => { this.lastT = t; this.tick(t); });
    }

    /* ---------------- 主菜单 / 难度 ---------------- */
    startGame() {
        this.reset();
        this.keys = {};                  // 清空菜单期间的残留按键
        this.state = 'playing';
        this.hideMenu();
        this.sound.ensure();
        this.sound.spawn();
    }
    backToMenu() {
        this.state = 'menu';
        this.keys = {};
        this.showMenu();
    }
    showMenu() { const el = document.getElementById('menuOverlay'); if (el) el.classList.add('visible'); }
    hideMenu() { const el = document.getElementById('menuOverlay'); if (el) el.classList.remove('visible'); }
    /* 菜单 UI：难度切换 + 开始按钮 */
    setupMenuUI() {
        const desc = document.getElementById('diffDesc');
        const btns = document.querySelectorAll('.diff-btn');
        const refresh = () => {
            desc.textContent = DIFFICULTY[this.difficulty].desc;
            btns.forEach(b => b.classList.toggle('active', b.dataset.diff === this.difficulty));
        };
        btns.forEach(b => b.addEventListener('click', () => {
            this.difficulty = b.dataset.diff;
            refresh();
            this.sound.ensure();
            this.sound.ping();
        }));
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        refresh();
    }

    /* 触屏虚拟操控：检测 ontouchstart，显示方向轮盘 + 开火 / 暂停按钮，
       通过写入 game.keys 复用键盘输入管线（按住持续移动 / 开火） */
    setupTouchUI() {
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
        if (!isTouch) return;
        document.body.classList.add('touch');

        const hold = (el, code) => {
            const on = ev => {
                ev.preventDefault();
                if (!this.keys[code]) this.keyTime[code] = performance.now();
                this.keys[code] = true;
                this.sound.ensure();
            };
            const off = ev => {
                ev.preventDefault();
                delete this.keys[code];
                delete this.keyTime[code];
            };
            el.addEventListener('touchstart', on, { passive: false });
            el.addEventListener('touchend', off, { passive: false });
            el.addEventListener('touchcancel', off, { passive: false });
        };

        document.querySelectorAll('#touchPad .tp-btn').forEach(b => hold(b, b.dataset.code));
        hold(document.getElementById('touchFire'), 'Space');   // 开火：按住连发

        // 暂停 / 继续 / 主菜单开始（点按切换，与 P 键、Enter 逻辑一致）
        document.getElementById('touchPause').addEventListener('touchstart', ev => {
            ev.preventDefault();
            this.sound.ensure();
            if (this.state === 'menu') this.startGame();
            else if (this.state === 'playing') this.state = 'paused';
            else if (this.state === 'paused') this.state = 'playing';
        }, { passive: false });
    }

    /* ---------------- 状态管理 ---------------- */
    reset() {
        this.state = 'playing';        // menu | playing | paused | over | clear
        this.diffCfg = DIFFICULTY[this.difficulty] || DIFFICULTY.normal;
        this.score = 0;
        this.lives = this.diffCfg.lives;
        this.wave = 1;
        this.enemiesLeft = this.diffCfg.enemies;  // 本波剩余敌机
        this.spawnTimer = this.diffCfg.spawnDelay + 0.5;  // 敌机刷新计时
        this.enemies = [];
        this.bullets = [];
        this.floats = [];              // 漂浮文字（+100）
        this.flashes = [];             // 闪光环
        this.shake = 0;                // 屏幕震动强度
        this.hurtFlash = 0;            // 玩家受击红闪强度
        this.powerups = [];            // 场上道具
        this.enemyFreeze = 0;          // ⏰ 时钟定身剩余时间
        this.shovelT = 0;              // 铁锹加固剩余时间
        this.shovelBase = null;        // 加固前的原始瓦片记录
        this.overReason = '';          // 游戏结束原因
        this.base = { alive: true, r: ROWS - 3, c: 11, h: 2, w: 4 };  // 基地（底部中央 2×4 格）
        this.tileMap.init();
        this.player = new PlayerTank(this, 6 * TILE, (ROWS - 2) * TILE);
        this.player.invincible = 3;    // 开局无敌
    }

    /* 当前所有存活坦克（玩家 + 敌人） */
    allTanks() { return [this.player, ...this.enemies]; }
    addBullet(b) { this.bullets.push(b); }
    /* 敌人被击毁：仅标记移除，enemiesLeft 配额在生成时已消耗，避免重复递减 */
    removeEnemy(e) { e.active = false; }

    /* 敌人阵亡统一处理：计分 / 掉落 / 爆炸特效（按类型差异） */
    killEnemy(e) {
        const g = this;
        const [cx, cy] = e.center();
        const big = e.kind === 'heavy';
        g.particles.burst(cx, cy, big ? 44 : 26, { color: ['#fef08a', '#fb923c', '#ef4444', '#fff7ed'], life: 0.6, size: big ? 5 : 4, grav: 120, drag: 2 });
        g.flashes.push({ x: cx, y: cy, r: big ? 46 : 34, life: 0.35, max: 0.35 });
        g.shake = Math.max(g.shake, big ? 12 : 8);
        g.freeze = Math.max(g.freeze, big ? 0.08 : 0.05);
        g.sound.boom();
        g.score += e.score;
        g.floats.push({ x: cx, y: cy - 14, text: '+' + e.score, life: 0.9, age: 0 });
        g.removeEnemy(e);
        if (Math.random() < e.dropChance) g.spawnPowerUp(cx, cy);
    }

    /* 波次加权随机敌坦类型：轻型 / 重装 / 火炮 */
    pickEnemyKind() {
        const w = this.wave;
        let weights = [1, 0, 0];
        if (w >= 2) weights = [0.65, 0.2, 0.15];
        if (w >= 3) weights = [0.5, 0.28, 0.22];
        if (w >= 5) weights = [0.38, 0.3, 0.32];
        const total = weights[0] + weights[1] + weights[2];
        let r = Math.random() * total;
        if ((r -= weights[0]) < 0) return 'light';
        if ((r -= weights[1]) < 0) return 'heavy';
        return 'artillery';
    }

    /* 掉落道具：加权随机类型 */
    spawnPowerUp(x, y) {
        const table = [
            [POWER.STAR, 0.34], [POWER.BOMB, 0.16], [POWER.CLOCK, 0.18],
            [POWER.SHIELD, 0.2], [POWER.SHOVEL, 0.12]
        ];
        let r = Math.random(), acc = 0, type = POWER.STAR;
        for (const [k, w] of table) { acc += w; if (r <= acc) { type = k; break; } }
        this.powerups.push(new PowerUp(this, x, y, type));
    }

    /* 拾取道具生效 */
    applyPowerUp(type, pu) {
        const p = this.player;
        let text = '';
        switch (type) {
            case POWER.STAR:
                if (p.level < 3) { p.applyLevel(p.level + 1); text = '火力升级 Lv' + p.level; this.sound.powerup(); }
                else { this.score += 300; text = '+300'; this.sound.ping(); }
                break;
            case POWER.BOMB:
                this.bombAll();
                text = '全屏炸弹!';
                break;
            case POWER.CLOCK:
                this.enemyFreeze = 5;
                this.sound.freeze();
                text = '时间冻结 5s';
                break;
            case POWER.SHIELD:
                p.invincible = 8;
                this.sound.shield();
                text = '能量护盾 8s';
                break;
            case POWER.SHOVEL:
                this.applyShovel();
                this.sound.shovel();
                text = '基地加固 8s';
                break;
        }
        pu.active = false;
        const cx = pu.x + 12, cy = pu.y + 12;
        this.floats.push({ x: cx, y: cy - 16, text, life: 1, age: 0 });
        this.particles.burst(cx, cy, 18, { color: ['#fef08a', '#38bdf8', '#4ade80', '#f87171'], life: 0.5, size: 3 });
        this.flashes.push({ x: cx, y: cy, r: 24, life: 0.4, max: 0.4 });
        this.sound.ping();
    }

    /* 💣 全屏炸弹：清场当前已生成的全部敌坦 */
    bombAll() {
        for (const e of [...this.enemies]) {
            if (!e.active) continue;
            const [cx, cy] = e.center();
            this.particles.burst(cx, cy, 30, { color: ['#fef08a', '#fb923c', '#ef4444', '#fff7ed'], life: 0.6, size: 4, grav: 120, drag: 2 });
            this.flashes.push({ x: cx, y: cy, r: 38, life: 0.35, max: 0.35 });
            this.score += e.score;
            this.floats.push({ x: cx, y: cy - 14, text: '+' + e.score, life: 0.9, age: 0 });
            e.active = false;
        }
        this.enemies = this.enemies.filter(e => e.active);
        this.shake = Math.max(this.shake, 14);
        this.freeze = Math.max(this.freeze, 0.1);
        this.sound.explode();
    }

    /* 🪓 铁锹：基地外围矩形区域临时加固为钢墙 */
    applyShovel() {
        this.shovelT = 8;
        if (this.shovelBase) return;                       // 已在加固中，仅刷新剩余时间
        const b = this.base, tm = this.tileMap;
        this.shovelBase = [];
        for (let r = b.r - 1; r <= b.r + b.h; r++) {
            for (let c = b.c - 1; c <= b.c + b.w; c++) {
                if (r >= b.r && r < b.r + b.h && c >= b.c && c < b.c + b.w) continue;  // 基地本体不动
                if (r < 0 || c < 0 || r >= ROWS || c >= COLS) continue;
                this.shovelBase.push({ r, c, orig: tm.get(r, c) });
                tm.set(r, c, TILE_STEEL);
            }
        }
    }
    restoreShovel() {
        if (!this.shovelBase) return;
        for (const { r, c, orig } of this.shovelBase) this.tileMap.set(r, c, orig);
        this.shovelBase = null;
        this.shovelT = 0;
    }

    /* 基地被子弹命中：玩家弹被吸收并提示；敌方弹摧毁基地 */
    hitBase(b) {
        const base = this.base;
        if (!base.alive) return false;
        const bx = base.c * TILE, by = base.r * TILE;
        if (!aabb(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2, bx, by, base.w * TILE, base.h * TILE)) return false;
        if (b.type === 'player') {
            this.particles.burst(b.x, b.y, 6, { color: '#facc15', life: 0.25, size: 2 });
            this.floats.push({ x: bx + base.w * TILE / 2, y: by - 8, text: '保护基地!', life: 1, age: 0 });
            b.die();
            this.sound.ping();
        } else {
            this.destroyBase(b.x, b.y);
            b.die();
        }
        return true;
    }
    destroyBase(x, y) {
        this.base.alive = false;
        this.shake = 16; this.freeze = 0.15;
        this.particles.burst(x, y, 50, { color: ['#fef08a', '#fb923c', '#ef4444', '#f87171'], life: 0.8, size: 5, grav: 150, drag: 1.5 });
        this.flashes.push({ x: x, y: y, r: 60, life: 0.5, max: 0.5 });
        this.sound.boom(); this.sound.explode();
        this.overReason = '基地被摧毁';
        this.state = 'over';
    }

    /* 绘制基地（鹰徽 / 废墟） */
    drawBase(ctx) {
        const b = this.base;
        const bx = b.c * TILE, by = b.r * TILE;
        ctx.save();
        ctx.fillStyle = b.alive ? '#1e293b' : '#0f172a';
        ctx.fillRect(bx, by, b.w * TILE, b.h * TILE);
        if (b.alive) {
            ctx.fillStyle = 'rgba(250,204,21,0.22)';
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.beginPath();                                  // 鹰翼
            ctx.moveTo(bx + 12, by + 18);
            ctx.lineTo(bx + 26, by + 6);
            ctx.lineTo(bx + 40, by + 18);
            ctx.lineTo(bx + 26, by + 44);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#facc15';                        // 徽星
            starPath(ctx, bx + 26, by + 25, 5, 10, 4.4);
            ctx.fill();
            ctx.fillStyle = '#0f172a';                        // 双眼
            ctx.beginPath(); ctx.arc(bx + 19, by + 15, 1.6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(bx + 33, by + 15, 1.6, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = '#334155';                        // 焦黑废墟
            ctx.fillRect(bx + 8, by + 24, 36, 6);
            ctx.fillRect(bx + 14, by + 18, 24, 4);
            ctx.fillRect(bx + 4, by + 34, 44, 4);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(bx + 16, by + 12, 20, 10);
        }
        ctx.restore();
    }

    /* ---------------- 输入解析 ---------------- */
    /* 返回最近按下的方向键（null 表示无输入） */
    resolveInputDir() {
        let best = null, bestT = -Infinity;
        const map = {
            'KeyW': DIR.UP, 'ArrowUp': DIR.UP,
            'KeyS': DIR.DOWN, 'ArrowDown': DIR.DOWN,
            'KeyA': DIR.LEFT, 'ArrowLeft': DIR.LEFT,
            'KeyD': DIR.RIGHT, 'ArrowRight': DIR.RIGHT
        };
        for (const code in map) {
            if (this.keys[code] && (this.keyTime[code] || 0) > bestT) {
                bestT = this.keyTime[code];
                best = map[code];
            }
        }
        return best;
    }

    /* ---------------- 主循环（固定步长物理） ---------------- */
    tick(now) {
        // 计算真实帧间隔并限制上限（防切后台后跳帧）
        let dt = Math.min((now - this.lastT) / 1000, 0.05);
        this.lastT = now;

        // 顿帧：命中停顿，时间不推进
        if (this.freeze > 0) {
            this.freeze -= dt;
            this.render();
            requestAnimationFrame(t => this.tick(t));
            return;
        }
        if (this.state === 'paused') {
            this.render();
            requestAnimationFrame(t => this.tick(t));
            return;
        }
        // 累加器实现固定步长，保证物理确定性
        this.acc += dt;
        const STEP = 1 / 120;
        while (this.acc >= STEP) {
            this.update(STEP);
            this.acc -= STEP;
        }
        this.render();
        requestAnimationFrame(t => this.tick(t));
    }

    /* ---------------- 逻辑更新 ---------------- */
    update(dt) {
        this.time += dt;
        if (this.state === 'menu') return;   // 主菜单：仅推进 time（水面 / 草丛动画），无战斗逻辑
        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 22);
        // 时钟定身 / 铁锹加固 / 受击红闪 计时
        if (this.enemyFreeze > 0) this.enemyFreeze -= dt;
        if (this.shovelT > 0) {
            this.shovelT -= dt;
            if (this.shovelT <= 0) this.restoreShovel();
        }
        this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.2);
        // 敌方刷新（场上同时存活数量 / 刷新间隔随难度提升）
        if (this.state === 'playing' && this.enemiesLeft > 0) {
            this.spawnTimer -= dt;
            if (this.spawnTimer <= 0 && this.enemies.length < this.diffCfg.maxOnField) {
                this.spawnEnemy();
                this.spawnTimer = this.diffCfg.spawnDelay + Math.random() * 0.5;
            }
        }
        // 波次清除判定（终局状态不被覆盖）
        if (this.state === 'playing' && this.enemiesLeft <= 0 && this.enemies.length === 0) {
            this.state = 'clear';
        }

        this.player.update(dt);
        for (const e of this.enemies) e.update(dt);

        // 道具更新 + 拾取判定
        for (const pu of this.powerups) pu.update(dt);
        this.powerups = this.powerups.filter(p => p.active);
        if (this.player.active) {
            for (const pu of this.powerups) {
                if (aabb(pu.x, pu.y, pu.size, pu.size, this.player.x, this.player.y, this.player.size, this.player.size)) {
                    this.applyPowerUp(pu.type, pu);
                    break;
                }
            }
        }

        // 子弹更新 + 子弹对撞抵消
        for (const b of this.bullets) b.update(dt);
        this.resolveBulletCollisions();
        this.bullets = this.bullets.filter(b => b.active);
        this.enemies = this.enemies.filter(e => e.active);

        this.particles.update(dt);
        // 漂浮文字
        for (const f of this.floats) f.age += dt;
        this.floats = this.floats.filter(f => f.age < f.life);
        // 闪光环
        for (const f of this.flashes) f.life -= dt;
        this.flashes = this.flashes.filter(f => f.life > 0);

        this.syncHud();
    }

    /* 子弹两两碰撞：互相抵消 */
    resolveBulletCollisions() {
        const bs = this.bullets;
        for (let i = 0; i < bs.length; i++) {
            if (!bs[i].active) continue;
            for (let j = i + 1; j < bs.length; j++) {
                if (!bs[j].active) continue;
                const a = bs[i], b = bs[j];
                if (Math.hypot(a.x - b.x, a.y - b.y) <= a.r + b.r + 2) {
                    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
                    this.particles.burst(mx, my, 10, { color: ['#fef08a', '#f87171', '#fff'], life: 0.3, size: 2.5 });
                    a.active = false; b.active = false;
                    this.sound.ping();
                }
            }
        }
    }

    /* 从四个经典出生点随机刷新敌机 */
    spawnEnemy() {
        const spots = [
            [1 * TILE, 1 * TILE], [17 * TILE, 1 * TILE],
            [9 * TILE, 1 * TILE]
        ];
        // 过滤被占用的出生点
        const free = spots.filter(([x, y]) =>
            !this.allTanks().some(t => aabb(x, y, 22, 22, t.x, t.y, t.size, t.size)));
        if (!free.length) { this.spawnTimer = 0.3; return; }
        const [x, y] = free[(Math.random() * free.length) | 0];
        const e = new EnemyTank(this, x, y, this.pickEnemyKind());
        this.enemies.push(e);
        this.enemiesLeft--;               // 生成时消耗配额（场上存活 + 待生成 = 本波总数，恒非负）
        this.sound.spawn();
        // 出生闪光
        const [cx, cy] = e.center();
        this.flashes.push({ x: cx, y: cy, r: 26, life: 0.5, max: 0.5 });
        this.particles.burst(cx, cy, 12, { color: '#e2e8f0', life: 0.35, size: 3 });
    }

    startNextWave() {
        this.wave++;
        this.enemiesLeft = Math.min(this.diffCfg.enemies + this.wave * 3, 24);
        this.spawnTimer = this.diffCfg.spawnDelay + 0.3;
        this.state = 'playing';
    }

    /* ---------------- 渲染 ---------------- */
    /* 浪尖儿社区专属科技暗纹底图：
       暗金 + 深蓝双色科技网格线 + 中央双语水印（科技切角边框 + 星徽纹理），
       绘制在瓦片层之下，作为战场的程序化背景装饰 */
    drawTechBackdrop(ctx) {
        const cx = W / 2, cy = H / 2;

        // 1) 深色径向渐变底（营造幽深战场氛围）
        const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, W * 0.75);
        g.addColorStop(0, 'rgba(30, 41, 59, 0.96)');
        g.addColorStop(0.6, 'rgba(15, 23, 42, 0.98)');
        g.addColorStop(1, 'rgba(5, 8, 18, 1)');
        ctx.fillStyle = g;
        ctx.fillRect(-10, -10, W + 20, H + 20);

        // 2) 科技网格线：深蓝细格 + 暗金主格
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(56, 130, 246, 0.07)';   // 副格（深蓝）
        const step = 44;
        ctx.beginPath();
        for (let x = 0; x <= W; x += step / 2) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
        for (let y = 0; y <= H; y += step / 2) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(250, 204, 21, 0.09)';   // 主格（暗金）
        ctx.beginPath();
        for (let x = 0; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
        for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();

        // 3) 中央双语水印框
        const bw = 340, bh = 158;
        const bx = cx - bw / 2, by = cy - bh / 2;
        ctx.save();
        ctx.globalAlpha = 0.85;

        // 外框 + 内框
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.20)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(bx, by, bw, bh);
        ctx.strokeStyle = 'rgba(96, 165, 250, 0.16)';
        ctx.strokeRect(bx + 10, by + 10, bw - 20, bh - 20);

        // 四角科技切角装饰
        const L = 18;
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.38)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(bx, by + L); ctx.lineTo(bx, by); ctx.lineTo(bx + L, by);                          // 左上
        ctx.moveTo(bx + bw - L, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + L);           // 右上
        ctx.moveTo(bx, by + bh - L); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + L, by + bh);           // 左下
        ctx.moveTo(bx + bw - L, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + bh - L); // 右下
        ctx.stroke();

        // 四角星徽纹理（五角星）
        ctx.fillStyle = 'rgba(250, 204, 21, 0.30)';
        [[bx - 13, by - 13], [bx + bw + 13, by - 13], [bx - 13, by + bh + 13], [bx + bw + 13, by + bh + 13]]
            .forEach(([sx, sy]) => { starPath(ctx, sx, sy, 5, 9, 4); ctx.fill(); });

        // 框内两侧点缀小星徽
        ctx.fillStyle = 'rgba(96, 165, 250, 0.22)';
        [by + bh / 2].forEach(yy => {
            starPath(ctx, bx + 26, yy, 5, 7, 3); ctx.fill();
            starPath(ctx, bx + bw - 26, yy, 5, 7, 3); ctx.fill();
        });

        // 中文水印
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(250, 204, 21, 0.20)';
        ctx.font = 'bold 30px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillText('浪尖儿大学生社区', cx, cy - 18);

        // 中英文分隔细线
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 44, cy - 2); ctx.lineTo(cx + 44, cy - 2);
        ctx.stroke();

        // 英文水印
        ctx.fillStyle = 'rgba(96, 165, 250, 0.26)';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('WAVEPEAK ELITE', cx, cy + 24);

        ctx.restore();
        ctx.globalAlpha = 1;
    }

    render() {
        const ctx = this.ctx;
        // 高 DPI：缩放上下文
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        // 屏幕震动：随机偏移
        let sx = 0, sy = 0;
        if (this.shake > 0) {
            sx = rand(-this.shake, this.shake);
            sy = rand(-this.shake, this.shake);
        }
        ctx.save();
        ctx.translate(sx, sy);

        // 浪尖儿社区专属科技暗纹底图（满分加分项，绘制于瓦片层之下）
        this.drawTechBackdrop(ctx);

        this.tileMap.draw(ctx, this.time);
        this.drawBase(ctx);
        for (const pu of this.powerups) pu.draw(ctx);
        for (const b of this.bullets) b.draw(ctx);
        this.player.draw(ctx);
        for (const e of this.enemies) e.draw(ctx);
        // ⏰ 冻结视觉：被定身的敌人罩上冰蓝
        if (this.enemyFreeze > 0) {
            ctx.fillStyle = 'rgba(56,189,248,0.30)';
            for (const e of this.enemies) if (e.active) ctx.fillRect(e.x, e.y, e.size, e.size);
        }
        // 草丛覆盖层（隐蔽效果）
        this.tileMap.drawGrassLayer(ctx, this.time);

        this.particles.draw(ctx);
        // 漂浮文字
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'center';
        for (const f of this.floats) {
            ctx.globalAlpha = Math.max(0, 1 - f.age / f.life);
            ctx.fillStyle = '#fde047';
            ctx.fillText(f.text, f.x, f.y - f.age * 30);
        }
        ctx.globalAlpha = 1;
        // 闪光环
        for (const f of this.flashes) {
            ctx.globalAlpha = f.life / f.max;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r * (1 - f.life / f.max) + 6, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        // 玩家受击红闪（屏幕边缘泛红）
        if (this.hurtFlash > 0) {
            ctx.fillStyle = 'rgba(239,68,68,' + (0.35 * this.hurtFlash).toFixed(3) + ')';
            ctx.fillRect(0, 0, W, H);
        }
        // 状态遮罩
        this.drawOverlay(ctx);
    }

    /* 开始 / 暂停 / 结束 / 清屏 遮罩 */
    drawOverlay(ctx) {
        if (this.state === 'menu' || this.state === 'playing') return;  // 主菜单由 DOM 遮罩，不重复绘制
        ctx.fillStyle = 'rgba(2,6,23,0.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        let title = '', sub = '';
        if (this.state === 'paused') { title = '已暂停'; sub = '按 P 继续'; }
        if (this.state === 'over') { title = 'GAME OVER'; sub = (this.overReason ? this.overReason + ' · ' : '') + '按 R 重新开始'; }
        if (this.state === 'clear') { title = '波次 ' + this.wave + ' 清空！'; sub = '按 Enter 进入下一波'; }
        ctx.font = 'bold 42px monospace';
        ctx.fillStyle = '#facc15';
        ctx.fillText(title, W / 2, H / 2 - 10);
        ctx.font = '15px monospace';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(sub, W / 2, H / 2 + 24);
    }

    syncHud() {
        document.getElementById('hudScore').textContent = this.score;
        document.getElementById('hudLives').textContent = Math.max(0, this.lives);
        // 剩余敌机 = 待生成配额 + 场上存活，恒等于本波总数，不会出现负数
        document.getElementById('hudEnemies').textContent = this.enemiesLeft + this.enemies.length;
        document.getElementById('hudWave').textContent = this.wave;
        document.getElementById('hudLevel').textContent = '★'.repeat(this.player.level);
    }

    /* ---------------- 事件绑定 ---------------- */
    bind() {
        window.addEventListener('keydown', e => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (!this.keys[e.code]) this.keyTime[e.code] = performance.now();
            this.keys[e.code] = true;

            // 首次交互时恢复音频
            this.sound.ensure();

            if (this.state === 'menu') {
                // 主菜单：回车 / 空格直接开战
                if (e.code === 'Enter' || e.code === 'Space') this.startGame();
                return;
            }
            if (e.code === 'Escape') {
                // 游戏中 / 暂停时返回主菜单
                if (this.state === 'playing' || this.state === 'paused') this.backToMenu();
            } else if (e.code === 'KeyP') {
                if (this.state === 'playing') this.state = 'paused';
                else if (this.state === 'paused') this.state = 'playing';
            } else if (e.code === 'KeyR') {
                this.reset();
            } else if (e.code === 'Enter' && this.state === 'clear') {
                this.startNextWave();
            } else if (e.code === 'KeyM') {
                this.sound.muted = !this.sound.muted;
            }
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    }
}

/* ============================ 10. 启动 ============================ */
const game = new GameEngine(document.getElementById('gameCanvas'));
window.__game = game; // 调试入口

</script>
